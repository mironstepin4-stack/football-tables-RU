<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#06070d">
<title>Футбол PRO · Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06070d;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.1);
  --text:#f2f5fc;
  --muted:#8a93ab;
  --primary:#ff2d55;
  --primary-glow:rgba(255,45,85,.55);
  --primary-dark:#c4003a;
  --accent:#ffcc00;
  --accent-glow:rgba(255,204,0,.45);
  --success:#00e5a0;
  --danger:#ff3b3b;
  --font-main:'Inter',system-ui,sans-serif;
  --font-display:'Space Grotesk','Inter',sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme=dark]){
    --bg:#f4f6fc;--surface:rgba(255,255,255,.85);--surface-2:rgba(255,255,255,.95);
    --border:rgba(20,30,70,.1);--text:#0f1424;--muted:#5a6480;
    --primary:#d90035;--primary-glow:rgba(217,0,53,.35);--primary-dark:#a30028;
    --accent:#c77800;--accent-glow:rgba(199,120,0,.3);--success:#00a878;
  }
}
:root[data-theme=light]{
  --bg:#f4f6fc;--surface:rgba(255,255,255,.85);--surface-2:rgba(255,255,255,.95);
  --border:rgba(20,30,70,.1);--text:#0f1424;--muted:#5a6480;
  --primary:#d90035;--primary-glow:rgba(217,0,53,.35);--primary-dark:#a30028;
  --accent:#c77800;--accent-glow:rgba(199,120,0,.3);--success:#00a878;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:90px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px var(--font-main);overflow-x:hidden;transition:background .4s,color .4s;overscroll-behavior-y:none}

/* ==================== ФОН ==================== */
.bg-3d{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.bg-glow{position:absolute;inset:0;z-index:-1;pointer-events:none}
.bg-glow i{position:absolute;border-radius:50%;filter:blur(140px);width:60vmax;height:60vmax;animation:fl 22s ease-in-out infinite alternate}
.bg-glow i:nth-child(1){background:var(--primary);opacity:.28;top:-22%;left:-12%}
.bg-glow i:nth-child(2){background:var(--accent);opacity:.14;bottom:-28%;right:-14%;animation-delay:-9s}
.bg-glow i:nth-child(3){background:var(--primary);opacity:.1;top:35%;left:50%;animation-delay:-14s}
@keyframes fl{to{transform:translate(8vw,6vh) scale(1.25)}}

.particles{position:absolute;inset:0;overflow:hidden}
.particle{position:absolute;border-radius:50%;animation:sparkRise linear infinite,sparkFlicker 1.5s ease-in-out infinite;will-change:transform,opacity}
.particle.tiny{width:2px;height:2px}
.particle.small{width:3px;height:3px}
.particle.medium{width:5px;height:5px}
.particle.large{width:7px;height:7px;filter:blur(.4px)}
@keyframes sparkRise{
  0%{transform:translateY(105vh) translateX(0) scale(.4);opacity:0}
  8%{opacity:1}
  40%{transform:translateY(60vh) translateX(var(--drift,10px)) scale(1);opacity:.9}
  70%{transform:translateY(30vh) translateX(calc(var(--drift,10px) * -0.6)) scale(.9);opacity:.7}
  100%{transform:translateY(-10vh) translateX(var(--drift,10px)) scale(.3);opacity:0}
}
@keyframes sparkFlicker{0%,100%{filter:brightness(1)}25%{filter:brightness(1.6)}50%{filter:brightness(.85)}75%{filter:brightness(1.4)}}

/* ==================== ХЕДЕР ==================== */
.hd{position:sticky;top:0;z-index:15;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px);transition:box-shadow .3s}
.hd.scrolled{box-shadow:0 8px 32px rgba(0,0,0,.4)}
.hdi{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:8px;font:800 18px var(--font-display);white-space:nowrap}
.brand .ball-emoji{display:inline-block;animation:spin 8s linear infinite;font-size:22px;filter:drop-shadow(0 0 8px var(--primary-glow))}
@keyframes spin{to{transform:rotate(360deg)}}
.lgs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px;scroll-behavior:smooth}
.lgs::-webkit-scrollbar{display:none}
.lb{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:600 13px var(--font-main);cursor:pointer;white-space:nowrap;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.lb span{font-size:16px}
.lb:hover{color:var(--text);transform:translateY(-2px);border-color:var(--primary);box-shadow:0 0 20px var(--primary-glow)}
.lb.on{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:transparent;box-shadow:0 6px 24px var(--primary-glow);transform:scale(1.02)}
.tg{display:flex;gap:8px;align-items:center}
.pf{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:600 13px var(--font-main);cursor:pointer;transition:all .3s}
.pf:hover{border-color:var(--primary);box-shadow:0 0 16px var(--primary-glow)}
.pf img,.prof img,.gi{width:28px;height:28px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--surface)}
.ic{padding:8px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:15px;transition:all .3s;min-width:40px;min-height:40px;display:grid;place-items:center}
.ic:hover{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 15%,transparent);box-shadow:0 0 16px var(--primary-glow)}

/* ==================== КОНТЕНТ ==================== */
.w{max-width:1240px;margin:0 auto;padding:24px 16px 100px}
h1{font:900 clamp(26px,5.5vw,52px)/1.05 var(--font-display);margin:6px 0 0;background:linear-gradient(100deg,var(--text) 0%,var(--primary) 50%,var(--accent) 100%);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradientShift 6s ease infinite,up .7s both}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sub{color:var(--muted);font-size:13px;margin-top:8px}
.hero{margin:22px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:up .6s both;transition:all .4s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--primary),var(--accent));transition:width .3s}
.k:hover{transform:translateY(-6px) scale(1.02);border-color:var(--primary);box-shadow:0 12px 40px var(--primary-glow)}
.k:hover::before{width:5px}
.k b{display:block;font:800 22px var(--font-display)}
.k span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}

/* Табы — на десктопе обычные, на телефоне скрываются, используются bottom-nav */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:5px;width:fit-content;max-width:100%;overflow-x:auto;margin-bottom:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--muted);padding:11px 18px;border-radius:14px;font:700 14px var(--font-main);cursor:pointer;white-space:nowrap;transition:all .35s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.tabs button::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--primary),var(--primary-dark));opacity:0;transition:opacity .3s;border-radius:14px;z-index:-1}
.tabs button:hover{color:var(--text);transform:translateY(-2px)}
.tabs button.on{color:#fff;transform:scale(1.05);box-shadow:0 8px 24px var(--primary-glow)}
.tabs button.on::after{opacity:1}

/* Нижняя навигация — только на телефоне */
.bottom-nav{
  display:none;
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:20;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  grid-template-columns:repeat(6,1fr);
  gap:2px;
}
.bottom-nav button{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  border:0;background:none;color:var(--muted);
  padding:8px 2px;border-radius:12px;
  font:600 10px var(--font-main);cursor:pointer;
  transition:all .3s;
  min-height:52px;
  position:relative;
}
.bottom-nav button .bi{font-size:18px;line-height:1;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.bottom-nav button.on{color:var(--primary)}
.bottom-nav button.on .bi{transform:scale(1.15)}
.bottom-nav button.on::before{
  content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);
  width:20px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  box-shadow:0 0 10px var(--primary-glow);
}

.view-enter{animation:viewEnter .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes viewEnter{0%{opacity:0;transform:translateY(20px);filter:blur(4px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
.stagger-item{animation:staggerIn .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes staggerIn{0%{opacity:0;transform:translateY(20px) rotateX(-12deg)}100%{opacity:1;transform:translateY(0) rotateX(0)}}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select{padding:12px 16px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:15px var(--font-main);outline:none;transition:all .3s;-webkit-appearance:none}
input{flex:1;min-width:150px}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-glow)}
.ch{padding:9px 15px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:600 12px var(--font-main);cursor:pointer;transition:all .3s;min-height:36px}
.ch:hover{color:var(--text);border-color:var(--primary);transform:translateY(-2px)}
.ch.on{color:#fff;background:var(--zc);border-color:transparent;box-shadow:0 6px 20px var(--primary-glow);transform:scale(1.05)}

/* ==================== ТАБЛИЦА (desktop) ==================== */
.tw{background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow-x:auto;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,.2)}
table{width:100%;border-collapse:collapse;min-width:660px}
th{font-size:11px;color:var(--muted);padding:15px 6px;text-transform:uppercase;letter-spacing:.9px;cursor:pointer;user-select:none;transition:color .2s}
th:hover{color:var(--primary)}
td{padding:12px 6px;text-align:center;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left;padding-left:12px}
tbody tr{opacity:0;animation:rowSlide .5s cubic-bezier(.34,1.56,.64,1) forwards;cursor:pointer;transition:background .3s,transform .3s}
tbody tr:hover{background:color-mix(in srgb,var(--primary) 10%,transparent);transform:scale(1.008)}
@keyframes rowSlide{0%{opacity:0;transform:translateX(-30px)}100%{opacity:1;transform:translateX(0)}}
.pos{font-weight:900;border-left:4px solid var(--zc);width:42px}
.tm{display:flex;align-items:center;gap:10px;font-weight:700}
.lg{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.15),0 4px 12px rgba(0,0,0,.3);overflow:hidden;background-size:cover;background-position:center}
.lg img{width:100%;height:100%;object-fit:contain;padding:3px}
.pts{font:800 19px var(--font-display);color:var(--primary);text-shadow:0 0 16px var(--primary-glow)}
.up{color:var(--success);font-weight:700}
.dn{color:var(--danger);font-weight:700}
.mini{height:6px;border-radius:9px;background:rgba(127,127,160,.15);min-width:64px;overflow:hidden}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:9px;width:0;animation:gw 1.2s .3s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes gw{to{width:var(--w)}}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}

/* ==================== МОБИЛЬНЫЕ КАРТОЧКИ ТАБЛИЦЫ ==================== */
.mobile-table{display:none}
.mt-card{
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--zc);
  border-radius:16px;padding:12px 14px;margin-bottom:8px;
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  cursor:pointer;transition:all .3s;
  animation:staggerIn .4s both;
}
.mt-card:active{transform:scale(.98);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.mt-pos{font:900 22px var(--font-display);color:var(--muted);min-width:32px;text-align:center}
.mt-mid{min-width:0}
.mt-name{display:flex;align-items:center;gap:8px;font:800 15px var(--font-display);margin-bottom:4px}
.mt-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-stats{display:flex;gap:10px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mt-stats b{color:var(--text);font-weight:700}
.mt-right{text-align:right}
.mt-pts{font:900 22px var(--font-display);color:var(--primary);text-shadow:0 0 12px var(--primary-glow);line-height:1}
.mt-form{font-size:10px;color:var(--muted);margin-top:2px}
.mt-zone{display:inline-block;margin-top:4px;font-size:9px;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--zc) 20%,transparent);color:var(--zc);font-weight:700}

/* ==================== СЕТКА КАРТОЧЕК ==================== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.cd{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:20px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:all .4s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.cd::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--zc) 0%,transparent 70%);opacity:0;transition:opacity .4s}
.cd:hover{transform:translateY(-8px) scale(1.03);border-color:var(--zc);box-shadow:0 24px 48px rgba(0,0,0,.4),0 0 40px var(--primary-glow)}
.cd:active{transform:translateY(-4px) scale(1.01)}
.cd:hover::before{opacity:.18}
.cd .rk{position:absolute;right:14px;top:4px;font:900 64px var(--font-display);color:var(--zc);opacity:.15;transition:opacity .3s,transform .3s}
.cd:hover .rk{opacity:.32;transform:scale(1.1)}
.cd h4{margin:12px 0 4px;font:800 19px var(--font-display)}
.cd small{color:var(--muted)}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;gap:10px;margin:12px 0;font-size:13px;color:var(--muted);text-align:center}
.bw{height:12px;background:rgba(127,127,160,.15);border-radius:9px;overflow:hidden;display:flex}
.bw.l{justify-content:flex-end}
.bw i{display:block;height:100%;border-radius:9px;width:0;animation:gw 1s forwards;box-shadow:0 0 12px currentColor}

.note{margin-top:20px;font-size:12.5px;color:var(--muted);line-height:1.7;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.md{position:fixed;inset:0;background:rgba(3,5,14,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;place-items:center;padding:14px;z-index:25}
.md.on{display:grid;animation:mdIn .25s}
@keyframes mdIn{from{opacity:0}}
.pn{background:var(--bg);border:1px solid var(--border);border-radius:24px;max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:24px;animation:popIn .45s cubic-bezier(.34,1.56,.64,1);box-shadow:0 32px 80px rgba(0,0,0,.5)}
@keyframes popIn{from{transform:scale(.85) translateY(30px);opacity:0}}
.pn h2{font:800 26px var(--font-display);margin:10px 0 4px}

.fs{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.fs.on{display:block;animation:fsIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes fsIn{from{opacity:0;transform:translateY(50px) scale(.97);filter:blur(6px)}}
.fsb{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);background:color-mix(in srgb,var(--bg) 85%,transparent);border-bottom:1px solid var(--border)}
.fsb b{font:800 17px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:center}
.back{padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:700 13px var(--font-main);cursor:pointer;transition:all .3s;min-height:40px}
.back:hover{border-color:var(--primary);box-shadow:0 0 20px var(--primary-glow)}
.fsw{max-width:1240px;margin:0 auto;padding:0 16px 90px}
.fsh{position:relative;margin:16px 0;border-radius:24px;padding:24px 20px;overflow:hidden;border:1px solid var(--border);background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 55%,transparent),color-mix(in srgb,var(--accent) 15%,transparent) 60%,transparent);animation:heroCardIn .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes heroCardIn{from{opacity:0;transform:scale(.95) translateY(20px)}}
.fsh .big{position:absolute;right:20px;top:-15px;font:900 clamp(100px,22vw,200px)/1 var(--font-display);color:var(--zc);opacity:.18;animation:bigNumberIn .8s cubic-bezier(.34,1.56,.64,1)}
@keyframes bigNumberIn{from{opacity:0;transform:translateX(50px) scale(.7)}}
.fsi{display:flex;gap:16px;align-items:center;position:relative}
.fsi .lg{width:68px;height:68px;font-size:24px}
.fsi h2{font:800 clamp(22px,5vw,42px)/1.05 var(--font-display);margin:0}
.zt{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:99px;font:700 11px var(--font-main);background:color-mix(in srgb,var(--zc) 22%,transparent);color:var(--zc);border:1px solid var(--zc);animation:pulseBadge 2s ease-in-out infinite}
@keyframes pulseBadge{0%,100%{box-shadow:0 0 0 0 var(--zc)}50%{box-shadow:0 0 20px 2px var(--zc)}}
.fsg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.fsg .k b{font-size:20px}
.form{display:flex;height:10px;border-radius:9px;overflow:hidden;margin:14px 0 4px;gap:3px}
.form i{display:block;min-width:0;transform-origin:left;animation:fm 1s cubic-bezier(.34,1.56,.64,1) both}
@keyframes fm{from{transform:scaleX(0)}}
.fsm{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.fsm>div:first-child{position:sticky;top:64px}
@media (max-width:900px){.fsm{grid-template-columns:1fr}.fsm>div:first-child{position:static}.brand b{display:none}}

/* ==================== ПОЛЕ ==================== */
.pitch{position:relative;width:100%;aspect-ratio:3/4;border-radius:20px;margin:10px 0 12px;border:2px solid rgba(255,255,255,.5);background:linear-gradient(0deg,rgba(0,0,0,.08) 0 50%,rgba(255,255,255,.03) 50% 100%),repeating-linear-gradient(0deg,#17754a 0 12.5%,#1b8556 12.5% 25%);box-shadow:inset 0 0 70px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.35);overflow:hidden;max-width:520px;margin-left:auto;margin-right:auto}
.pitch .line{position:absolute;border:2px solid rgba(255,255,255,.45);pointer-events:none}
.pitch .line.mid-h{left:0;right:0;top:50%;border-width:2px 0 0}
.pitch .center-circle{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.45);border-radius:50%;pointer-events:none}
.pitch .center-dot{position:absolute;left:50%;top:50%;width:4px;height:4px;transform:translate(-50%,-50%);background:rgba(255,255,255,.6);border-radius:50%;pointer-events:none}

// Загрузка логотипа команды (с кэшем)
async function fetchTeamLogo(name){
  if(TEAM_LOGO_CACHE[name] !== undefined) return TEAM_LOGO_CACHE[name];
  const en = TEAM_EN[name] || name;
  try{
    const r = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(en)}`);
    if(!r.ok){TEAM_LOGO_CACHE[name]=null;return null}
    const j = await r.json();
    const t = j.teams && j.teams[0];
    if(t && t.strTeamBadge){TEAM_LOGO_CACHE[name]=t.strTeamBadge;return t.strTeamBadge}
    TEAM_LOGO_CACHE[name]=null;
  }catch(e){TEAM_LOGO_CACHE[name]=null}
  return null;
}

// Ленивая подгрузка логотипов через IntersectionObserver
let logoObserver = null;
function initLogoObserver(){
  if(!('IntersectionObserver' in window)) return;
  logoObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const el = entry.target;
        logoObserver.unobserve(el);
        applyTeamLogo(el, el.dataset.logo, el.dataset.color);
      }
    });
  },{rootMargin:"100px"});
}
function observeLogos(){
  if(!logoObserver){
    // fallback — просто грузим все
    document.querySelectorAll(".lg[data-logo]:not([data-loaded])").forEach(el=>{
      el.dataset.loaded = "1";
      applyTeamLogo(el, el.dataset.logo, el.dataset.color);
    });
    return;
  }
  document.querySelectorAll(".lg[data-logo]:not([data-loaded])").forEach(el=>{
    el.dataset.loaded = "1";
    logoObserver.observe(el);
  });
}

function applyTeamLogo(el,name,color){
  if(!el)return;
  const cached = TEAM_LOGO_CACHE[name];
  if(cached){el.innerHTML = `<img src="${cached}" alt="${name}" loading="lazy">`;return}
  if(cached === null){
    // уже пытались загрузить, нет логотипа — оставляем инициалы
    return;
  }
  // Показываем инициалы, потом подгружаем
  fetchTeamLogo(name).then(url=>{
    if(url && el.isConnected){
      el.innerHTML = `<img src="${url}" alt="${name}" loading="lazy" onerror="this.parentNode.textContent='${el.textContent}'">`;
    }
  });
}

function betMatches(){
  const a = T();
  const pairs = [];
  const offset = (betRound*3) % Math.max(1,a.length-4);
  for(let i=0;i<4;i++){
    const hi = (i+offset) % a.length;
    const li = (i+offset+5) % a.length;
    if(hi===li)continue;
    const flip = (betRound+i) % 2 === 1;
    const home = flip ? a[li] : a[hi];
    const away = flip ? a[hi] : a[li];
    pairs.push({home,away});
  }
  const t1 = (betRound)%4, t2 = (betRound+2)%4;
  if(t1!==t2){
    const flip = betRound % 2 === 1;
    pairs.push(flip ? {home:a[t2],away:a[t1]} : {home:a[t1],away:a[t2]});
  }
  return pairs;
}

// Возвращает объект с вероятностями и коэффициентами
function calcOdds(home,away){
  const sH = home.p/home.g, sA = away.p/away.g;
  const diff = sH - sA;
  let pHome = 0.4 + diff*0.16;
  let pDraw = 0.26 - Math.abs(diff)*0.06;
  let pAway = 1 - pHome - pDraw;
  pHome = Math.max(0.05,Math.min(0.85,pHome));
  pDraw = Math.max(0.08,Math.min(0.35,pDraw));
  pAway = Math.max(0.05,Math.min(0.85,1-pHome-pDraw));
  const sum = pHome+pDraw+pAway;
  pHome/=sum;pDraw/=sum;pAway/=sum;
  const margin = 1.05;
  return {
    pHome, pDraw, pAway,
    oddsHome:+(margin/pHome).toFixed(2),
    oddsDraw:+(margin/pDraw).toFixed(2),
    oddsAway:+(margin/pAway).toFixed(2)
  };
}

// ЧИСТАЯ функция симуляции. Принимает объект с вероятностями.
// Возвращает: {result: 0|1|2, win: bool}
function simulate(prob){
  const r = Math.random();
  if(r < prob.pHome) return {result:0, win:false};
  if(r < prob.pHome + prob.pDraw) return {result:1, win:false};
  return {result:2, win:false};
}

// Обрабатывает ставку: списывает, симулирует, начисляет, пишет историю
function placeBet(match, outcome, betOdds){
  const amount = 100;
  if(betBalance < amount) return {error:"Недостаточно средств"};
  const prob = calcOdds(match.home, match.away);
  const sim = simulate(prob);
  const win = sim.result === outcome;
  betBalance -= amount;
  let payout = 0;
  if(win){
    payout = Math.round(amount * betOdds);
    betBalance += payout;
  }
  const record = {
    match: `${match.home.n} — ${match.away.n}`,
    outcome: outcome===0?"П1":outcome===1?"X":"П2",
    amount, odds: betOdds, status: win?"win":"lose",
    payout, result: sim.result, timestamp: Date.now()
  };
  betHistory.unshift(record);
  betHistory = betHistory.slice(0,30);
  save();
  return {win, payout, amount, record};
}
