<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0d1b2a">
<title>Футбол PRO · Live Score & xG</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1b2a; --bg-elevated:#1b263b;
  --surface:rgba(255,255,255,.05); --surface-2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.1); --border-strong:rgba(255,255,255,.16);
  --text:#f5f0fa; --text-secondary:#a094b0; --text-tertiary:#6b5f7a;
  --red:#e76f51; --orange:#f4a261; --teal:#2a9d8f; --blue:#4a9eff;
  --red-soft:rgba(231,111,81,.15); --teal-soft:rgba(42,157,143,.15);
  --success:#2a9d8f; --danger:#e76f51; --draw:#6b7280;
  --font-main:'Inter',system-ui,-apple-system,sans-serif;
  --font-display:'Space Grotesk','Inter',sans-serif;
  --radius-xl:24px; --radius-lg:18px; --radius-md:14px; --radius-sm:10px; --radius-xs:8px;
  --ease-soft:cubic-bezier(.22,1,.36,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
}
:root[data-theme="light"]{
  --bg:#faf5f7; --bg-elevated:#ffffff; --surface:rgba(0,0,0,.04); --surface-2:rgba(0,0,0,.06);
  --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14); --text:#1a0f14; --text-secondary:#6b5f7a; --text-tertiary:#a094b0;
  --red:#c1121f; --red-soft:rgba(193,18,31,.1); --teal:#0a9396; --teal-soft:rgba(10,147,150,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font-main);overflow-x:hidden;overscroll-behavior-y:none;min-height:100vh}

.bg-layer{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(ellipse 70% 55% at 15% -10%, rgba(231,111,81,.25), transparent 65%),
  radial-gradient(ellipse 55% 45% at 85% 110%, rgba(42,157,143,.2), transparent 65%),
  radial-gradient(ellipse 40% 30% at 50% 50%, rgba(244,162,97,.06), transparent 70%), var(--bg)}
.bg-layer::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 30% 20%, rgba(244,162,97,.08), transparent 40%),
  radial-gradient(circle at 70% 80%, rgba(42,157,143,.1), transparent 40%);
  animation:auroraShift 22s var(--ease-soft) infinite alternate}
@keyframes auroraShift{0%{transform:scale(1) rotate(0deg);opacity:.7}50%{transform:scale(1.15) rotate(3deg);opacity:1}100%{transform:scale(1.05) rotate(-2deg);opacity:.85}}
.bg-layer::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0);background-size:36px 36px;mask-image:radial-gradient(ellipse at 50% 30%, black 20%, transparent 80%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%, black 20%, transparent 80%);pointer-events:none}
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particle{position:absolute;border-radius:50%;animation:sparkRise linear infinite,sparkFlicker 2s ease-in-out infinite;will-change:transform,opacity}
.particle.tiny{width:2px;height:2px}.particle.small{width:3px;height:3px}.particle.medium{width:4px;height:4px}.particle.large{width:6px;height:6px;filter:blur(.4px)}
@keyframes sparkRise{0%{transform:translateY(105vh) translateX(0) scale(.4);opacity:0}8%{opacity:1}40%{transform:translateY(60vh) translateX(var(--drift,10px)) scale(1);opacity:.85}70%{transform:translateY(30vh) translateX(calc(var(--drift,10px) * -0.6)) scale(.9);opacity:.6}100%{transform:translateY(-10vh) translateX(var(--drift,10px)) scale(.3);opacity:0}}
@keyframes sparkFlicker{0%,100%{filter:brightness(1) hue-rotate(0deg)}25%{filter:brightness(1.6) hue-rotate(15deg)}50%{filter:brightness(.85) hue-rotate(-10deg)}75%{filter:brightness(1.4) hue-rotate(5deg)}}

.hd{position:sticky;top:0;z-index:20;backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);background:color-mix(in srgb,var(--bg) 75%,transparent);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px);transition:box-shadow .4s var(--ease-soft),border-color .4s var(--ease-soft)}
.hd.scrolled{box-shadow:0 6px 32px rgba(231,111,81,.15),0 4px 24px rgba(0,0,0,.4);border-bottom-color:color-mix(in srgb,var(--red) 30%,transparent)}
.hdi{max-width:1280px;margin:0 auto;padding:7px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:5px;font:800 16px var(--font-display);white-space:nowrap;letter-spacing:-.3px}
.brand .ball{font-size:18px;filter:drop-shadow(0 0 8px rgba(231,111,81,.7));animation:ballSpin 8s linear infinite}
@keyframes ballSpin{to{transform:rotate(360deg)}}
.lgs{display:flex;gap:5px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 0;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.lgs::-webkit-scrollbar{display:none}
.lb{display:flex;align-items:center;gap:4px;padding:6px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font:600 12px var(--font-main);cursor:pointer;white-space:nowrap;transition:all .35s var(--ease-soft)}
.lb span{font-size:14px}
.lb:hover{color:var(--text);background:var(--surface-2);transform:translateY(-1px)}
.lb.on{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(231,111,81,.5);transform:scale(1.03)}
.tg{display:flex;gap:5px;align-items:center}
.ic{padding:7px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:14px;min-width:34px;min-height:34px;display:grid;place-items:center;transition:all .35s var(--ease-soft)}
.ic:hover{background:var(--surface-2);border-color:var(--red);box-shadow:0 0 14px rgba(231,111,81,.35);transform:translateY(-2px)}
.pf{display:flex;align-items:center;gap:5px;padding:3px 12px 3px 3px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:600 11px var(--font-main);cursor:pointer;transition:all .35s var(--ease-soft)}
.pf:hover{border-color:var(--red);box-shadow:0 0 12px rgba(231,111,81,.3);transform:translateY(-1px)}
.pf img,.gi{width:26px;height:26px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--surface-2);font-size:13px}

.w{max-width:1280px;margin:0 auto;padding:16px 14px 100px}
h1{font:800 clamp(22px,4.5vw,34px)/1.05 var(--font-display);margin:2px 0 0;letter-spacing:-.5px;background:linear-gradient(135deg,var(--text) 0%,var(--red) 50%,var(--orange) 100%);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradientShift 9s var(--ease-soft) infinite}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sub{color:var(--text-secondary);font-size:12px;margin-top:4px}

.hero{margin:10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px}
.k{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .4s var(--ease-soft);position:relative;overflow:hidden}
.k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--red),var(--orange));border-radius:0 3px 3px 0;transition:width .4s var(--ease-soft)}
.k:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--red) 40%,transparent);box-shadow:0 10px 26px rgba(231,111,81,.22)}
.k:hover::before{width:5px}
.k b{display:block;font:800 17px var(--font-display);line-height:1.15}
.k span{font-size:9px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.7px;font-weight:600}

.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:4px;width:fit-content;max-width:100%;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--text-secondary);padding:8px 14px;border-radius:var(--radius-md);font:600 12.5px var(--font-main);cursor:pointer;white-space:nowrap;transition:all .35s var(--ease-soft)}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;box-shadow:0 4px 14px rgba(231,111,81,.4);transform:scale(1.02)}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(6,1fr);gap:2px}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--text-tertiary);padding:6px 1px;border-radius:var(--radius-md);font:600 8px var(--font-main);cursor:pointer;transition:all .35s var(--ease-soft);min-height:48px;position:relative}
.bottom-nav button .bi{font-size:16px;line-height:1;transition:transform .4s var(--ease-bounce)}
.bottom-nav button.on{color:var(--red);background:var(--red-soft)}
.bottom-nav button.on .bi{transform:scale(1.18)}
.bottom-nav button.on::before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:16px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--red),var(--orange));box-shadow:0 0 8px var(--red)}

.view-enter{animation:viewEnter .5s var(--ease-soft) both}
@keyframes viewEnter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.stagger-item{animation:staggerIn .5s var(--ease-soft) both}
@keyframes staggerIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
input,select{padding:9px 12px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);color:var(--text);font:13px var(--font-main);outline:none;transition:all .35s var(--ease-soft);-webkit-appearance:none}
input{flex:1;min-width:130px}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft),0 0 20px rgba(231,111,81,.2)}
.ch{padding:6px 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font:600 11.5px var(--font-main);cursor:pointer;transition:all .35s var(--ease-soft);min-height:30px}
.ch:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}
.ch.on{color:#fff;background:var(--zc,var(--red));border-color:transparent;box-shadow:0 4px 12px color-mix(in srgb,var(--zc,var(--red)) 45%,transparent);transform:scale(1.05)}

/* ==================== COMPACT TABLE ==================== */
.compact-table{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:staggerIn .5s var(--ease-soft) both}
.compact-table table{width:100%;border-collapse:collapse;table-layout:fixed}
.compact-table thead th{font-size:8.5px;color:var(--text-tertiary);padding:7px 3px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;background:var(--surface);border-bottom:1px solid var(--border);text-align:center;cursor:pointer;user-select:none;transition:color .3s}
.compact-table thead th:hover{color:var(--red)}
.compact-table thead th:nth-child(1){text-align:left;padding-left:10px;width:32px}
.compact-table thead th:nth-child(2){text-align:left;padding-left:3px}
.compact-table tbody td{padding:6px 3px;text-align:center;font-size:12px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums;line-height:1}
.compact-table tbody td:nth-child(1){text-align:left;padding-left:10px;font-weight:800;color:var(--text-tertiary);font-size:11px;width:32px;position:relative}
.compact-table tbody td:nth-child(1)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--zc,transparent);border-radius:0 3px 3px 0}
.compact-table tbody td:nth-child(2){text-align:left;padding-left:3px;overflow:hidden}
.compact-table tbody tr{cursor:pointer;transition:background .3s var(--ease-soft)}
.compact-table tbody tr:hover{background:color-mix(in srgb,var(--red) 6%,transparent)}
.compact-table .team-cell{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;min-width:0}
.compact-table .team-cell .lg{width:20px;height:20px;font-size:7px;flex-shrink:0}
.compact-table .team-cell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compact-table .pts{font:800 14px var(--font-display);color:var(--red)}
.compact-table .gd{font-weight:700;font-size:11px}
.compact-table .gd.up{color:var(--success)}
.compact-table .gd.dn{color:var(--danger)}
.compact-table .st{font-size:12px;padding:0;min-width:16px;line-height:1}

/* ==================== MATCH LIST ==================== */
.match-section{margin-top:12px;animation:staggerIn .5s var(--ease-soft) .1s both}
.match-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 2px}
.match-section-head h2{margin:0;font:700 13px var(--font-display);display:flex;align-items:center;gap:5px}
.match-section-head .cnt{font:600 10px var(--font-main);color:var(--text-tertiary);background:var(--surface);padding:3px 9px;border-radius:99px;border:1px solid var(--border)}
.match-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.match-item{display:grid;grid-template-columns:1fr 50px 1fr 26px;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:11.5px;cursor:pointer;transition:all .3s var(--ease-soft);animation:staggerIn .4s var(--ease-soft) both}
.match-item:last-child{border-bottom:none}
.match-item:hover{background:color-mix(in srgb,var(--red) 5%,transparent)}
.match-item .mt-team{display:flex;align-items:center;gap:5px;min-width:0;font-weight:600}
.match-item .mt-team.home{justify-content:flex-end;text-align:right}
.match-item .mt-team.away{justify-content:flex-start;text-align:left}
.match-item .mt-team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-item .mt-team .lg{width:16px;height:16px;font-size:6px;flex-shrink:0}
.match-item .mt-score{font:800 12.5px var(--font-display);padding:3px 0;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);text-align:center;letter-spacing:.3px;width:50px;justify-self:center}
.match-item.win-home .mt-score{background:rgba(42,157,143,.15);border-color:rgba(42,157,143,.35);color:var(--teal)}
.match-item.win-away .mt-score{background:rgba(74,158,255,.15);border-color:rgba(74,158,255,.35);color:var(--blue)}
.match-item.draw .mt-score{background:rgba(107,114,128,.15);border-color:rgba(107,114,128,.3);color:#9ca3af}
.match-item .mt-detail{font-size:8.5px;color:var(--text-tertiary);text-align:center;margin-top:2px;grid-column:1/-1;font-style:italic}
.match-item .mt-analyze{padding:4px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-tertiary);cursor:pointer;display:grid;place-items:center;transition:all .35s var(--ease-soft);font-size:11px;width:24px;height:24px;flex-shrink:0}
.match-item .mt-analyze:hover{border-color:var(--red);color:var(--red);background:var(--red-soft);transform:scale(1.12) rotate(-6deg)}

/* ==================== TEAM VIEW ==================== */
.team-page{animation:viewEnter .5s var(--ease-soft) both}
.team-hero{position:relative;border-radius:var(--radius-xl);padding:16px 16px;margin-bottom:12px;overflow:hidden;border:1px solid var(--border);background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 35%,transparent),transparent 65%)}
.team-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,var(--zc) 0%,transparent 60%);opacity:.12;pointer-events:none}
.team-hero .big-num{position:absolute;right:12px;top:-12px;font:900 clamp(60px,14vw,110px)/1 var(--font-display);color:var(--zc);opacity:.13;pointer-events:none}
.team-hero-inner{display:flex;gap:12px;align-items:center;position:relative;z-index:1}
.team-hero-inner .lg{width:52px;height:52px;font-size:19px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.team-hero-inner h2{font:800 clamp(18px,4vw,28px)/1.05 var(--font-display);margin:0;letter-spacing:-.4px}
.team-hero-inner .meta{font-size:11.5px;color:var(--text-secondary);margin-top:3px}
.team-hero-inner .zone{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;font:700 9.5px var(--font-main);background:color-mix(in srgb,var(--zc) 18%,transparent);color:var(--zc);border:1px solid color-mix(in srgb,var(--zc) 40%,transparent)}

.team-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px;margin-bottom:12px}
.team-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 8px;text-align:center;transition:all .4s var(--ease-soft);position:relative;overflow:hidden}
.team-stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--red),var(--orange));opacity:.7;border-radius:0 3px 3px 0}
.team-stat:hover{border-color:color-mix(in srgb,var(--red) 35%,transparent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(231,111,81,.15)}
.team-stat b{display:block;font:800 17px var(--font-display);line-height:1.1;margin-bottom:1px}
.team-stat span{font-size:8.5px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;font-weight:600}

.team-form{margin-bottom:12px}
.team-form-label{font-size:9px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:4px}
.team-form-bar{display:flex;gap:3px;height:8px;border-radius:6px;overflow:hidden}
.team-form-bar i{display:block;transition:flex .6s var(--ease-soft);border-radius:4px}

.team-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:14px;margin-bottom:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.team-section h3{margin:0 0 10px;font:700 13.5px var(--font-display);display:flex;align-items:center;gap:6px}
.team-section h3 .icon{font-size:14px}

.mini-pitch{position:relative;width:100%;max-width:400px;aspect-ratio:5/6;margin:0 auto 12px;border-radius:var(--radius-lg);border:2px solid rgba(255,255,255,.28);background:repeating-linear-gradient(0deg,#1a6b42 0 10%,#1e7a4c 10% 20%);box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);overflow:hidden}
.mini-pitch .line{position:absolute;border:1.5px solid rgba(255,255,255,.25);pointer-events:none}
.mini-pitch .mid-h{left:0;right:0;top:50%;border-width:1.5px 0 0}
.mini-pitch .cc{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:1.5px solid rgba(255,255,255,.25);border-radius:50%}
.mini-pitch .box-t{position:absolute;left:22%;width:56%;height:11%;top:0;border:1.5px solid rgba(255,255,255,.25);border-top:0}
.mini-pitch .box-b{position:absolute;left:22%;width:56%;height:11%;bottom:0;border:1.5px solid rgba(255,255,255,.25);border-bottom:0}
.mini-pitch .goal-t{position:absolute;left:38%;width:24%;height:2%;top:0;border:1.5px solid rgba(255,255,255,.35);border-top:0}
.mini-pitch .goal-b{position:absolute;left:38%;width:24%;height:2%;bottom:0;border:1.5px solid rgba(255,255,255,.35);border-bottom:0}

.player-dot{position:absolute;width:clamp(30px,8vw,38px);height:clamp(30px,8vw,38px);transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;border:2.5px solid var(--c,#fff);background:linear-gradient(135deg,var(--c),rgba(0,0,0,.4));box-shadow:0 4px 14px rgba(0,0,0,.55);transition:transform .4s var(--ease-bounce),box-shadow .35s var(--ease-soft);animation:dotIn .5s var(--ease-bounce) both;z-index:3;overflow:visible;display:grid;place-items:center}
.player-dot:hover{transform:translate(-50%,-50%) scale(1.2);z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.7),0 0 24px var(--c)}
.player-dot .initials{font:800 12px var(--font-display);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);letter-spacing:.5px}
.player-dot .num{position:absolute;right:-3px;bottom:-3px;min-width:15px;height:15px;border-radius:8px;background:#0a0e1a;color:#fff;font:800 8px var(--font-main);display:grid;place-items:center;padding:0 3px;border:2px solid var(--c);z-index:2}
.player-dot .nm-tag{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%) scale(.8);transform-origin:top center;font:600 8.5px var(--font-main);color:#fff;background:rgba(0,0,0,.8);padding:2px 6px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:all .35s var(--ease-soft)}
.player-dot:hover .nm-tag{opacity:1;transform:translateX(-50%) scale(1)}
@keyframes dotIn{from{opacity:0;transform:translate(-50%,-50%) scale(0)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

.player-list{display:grid;gap:6px}
.player-card{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border);transition:all .35s var(--ease-soft);animation:staggerIn .4s var(--ease-soft) both}
.player-card:hover{border-color:color-mix(in srgb,var(--red) 30%,transparent);transform:translateX(4px);background:color-mix(in srgb,var(--red) 4%,var(--surface-2));box-shadow:0 4px 14px rgba(0,0,0,.2)}
.player-card .pav{width:36px;height:36px;border-radius:50%;flex-shrink:0;border:2px solid var(--pc,#666);background:linear-gradient(135deg,var(--pc),rgba(0,0,0,.4));display:grid;place-items:center}
.player-card .pav .initials{font:800 12px var(--font-display);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.player-card .pinfo{flex:1;min-width:0}
.player-card .pname{font:700 12.5px var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-card .pmeta{font-size:10px;color:var(--text-tertiary);margin-top:1px;display:flex;gap:5px;align-items:center}
.player-card .pmeta .pos-badge{padding:1px 6px;border-radius:6px;background:color-mix(in srgb,var(--pc) 18%,transparent);color:var(--pc);font-weight:700;font-size:9px}
.player-card .rating{font:800 11.5px var(--font-display);padding:3px 8px;border-radius:8px;color:#fff}
.player-card .rating.great{background:linear-gradient(135deg,#10b981,#059669)}
.player-card .rating.good{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.player-card .rating.avg{background:linear-gradient(135deg,#f59e0b,#d97706)}
.player-card .rating.poor{background:linear-gradient(135deg,#ef4444,#dc2626)}

.player-group-title{font:700 11.5px var(--font-display);color:var(--text-secondary);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.player-group-title:first-child{margin-top:0}
.player-group-title .dot-c{width:8px;height:8px;border-radius:50%;background:var(--gc);box-shadow:0 0 6px var(--gc)}

.team-matches{display:grid;gap:6px}
.tm-row{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border);font-size:11.5px;transition:all .3s var(--ease-soft);cursor:pointer}
.tm-row:hover{border-color:color-mix(in srgb,var(--red) 30%,transparent);transform:translateX(3px)}
.tm-row .tt{display:flex;align-items:center;gap:5px;min-width:0;font-weight:600}
.tm-row .tt.home{justify-content:flex-end}
.tm-row .tt.away{justify-content:flex-start}
.tm-row .tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-row .tt .lg{width:16px;height:16px;font-size:6px}
.tm-row .sc{font:800 12.5px var(--font-display);padding:3px 0;border-radius:8px;background:var(--surface);border:1px solid var(--border);text-align:center;width:50px;justify-self:center}
.tm-row .sc.win{background:rgba(42,157,143,.15);border-color:rgba(42,157,143,.35);color:var(--teal)}
.tm-row .sc.lose{background:rgba(231,111,81,.15);border-color:rgba(231,111,81,.35);color:var(--danger)}
.tm-row .dt{grid-column:1/-1;font-size:8.5px;color:var(--text-tertiary);text-align:center;margin-top:1px;font-style:italic}

.next-match{background:linear-gradient(135deg,color-mix(in srgb,var(--red) 12%,transparent),color-mix(in srgb,var(--orange) 6%,transparent));border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:var(--radius-lg);padding:11px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;transition:all .35s var(--ease-soft)}
.next-match:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(231,111,81,.2)}
.next-match .ic2{font-size:20px;flex-shrink:0}
.next-match .txt{flex:1;min-width:0}
.next-match .txt b{display:block;font:700 12.5px var(--font-display);margin-bottom:1px}
.next-match .txt small{font-size:10.5px;color:var(--text-secondary)}

.near-table{display:grid;gap:5px}
.near-row{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border);cursor:pointer;transition:all .35s var(--ease-soft)}
.near-row:hover{border-color:color-mix(in srgb,var(--red) 35%,transparent);transform:translateX(4px)}
.near-row.me{border-color:var(--red);background:linear-gradient(135deg,color-mix(in srgb,var(--red) 10%,transparent),transparent);box-shadow:0 4px 14px rgba(231,111,81,.15)}
.near-row .rn{font:800 12px var(--font-display);color:var(--text-tertiary);width:18px;text-align:center}
.near-row .lg{width:20px;height:20px;font-size:7px}
.near-row span{flex:1;font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.near-row strong{font:800 13px var(--font-display);color:var(--red)}

/* ==================== OTHER VIEWS ==================== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cd{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:14px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:all .45s var(--ease-soft);position:relative;overflow:hidden;animation:staggerIn .4s var(--ease-soft) both}
.cd::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--zc) 0%,transparent 70%);opacity:0;transition:opacity .5s var(--ease-soft)}
.cd:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--red) 40%,transparent);box-shadow:0 16px 40px rgba(0,0,0,.35),0 0 36px rgba(231,111,81,.18)}
.cd:hover::before{opacity:.12}
.cd .rk{position:absolute;right:10px;top:0;font:900 46px var(--font-display);color:var(--zc);opacity:.12;transition:all .45s var(--ease-soft)}
.cd:hover .rk{opacity:.25;transform:scale(1.08)}
.cd h4{margin:8px 0 2px;font:700 14.5px var(--font-display);position:relative}
.cd small{color:var(--text-secondary);font-size:11px;position:relative}
.cd .st{position:absolute;right:10px;bottom:8px;z-index:2}

.lg{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .35s var(--ease-bounce)}
.lg img{width:100%;height:100%;object-fit:contain;padding:2px}
.st{cursor:pointer;color:var(--text-tertiary);font-size:16px;transition:all .4s var(--ease-soft);opacity:.5;display:inline-block;padding:1px;min-width:24px;text-align:center}
.st:hover{transform:scale(1.35);opacity:1}
.st.on{color:var(--orange);opacity:1;text-shadow:0 0 12px var(--orange)}

/* ==================== COMPARISON ==================== */
.cmp-selects{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cmp-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.cmp-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.cmp-head .team-side{display:flex;align-items:center;gap:7px;min-width:0}
.cmp-head .team-side.right{justify-content:flex-end}
.cmp-head .team-side .lg{width:36px;height:36px;font-size:13px}
.cmp-head .team-side b{font:800 14px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-head .vs-badge{font:700 10px var(--font-display);color:var(--text-tertiary);padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border)}
.cmp-rows{display:grid;gap:9px}
.cmp-row{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;gap:8px;font-size:12px}
.cmp-row .lbl{text-align:center;font-size:9.5px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.cmp-row .val{font:800 14px var(--font-display);color:var(--text);margin-bottom:3px}
.cmp-row .val.right{text-align:right}
.cmp-row .val.best{color:var(--teal)}
.cmp-bar{height:6px;border-radius:4px;background:rgba(127,127,160,.12);overflow:hidden;display:flex}
.cmp-bar.left{justify-content:flex-end}
.cmp-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--orange));animation:gw 1s var(--ease-soft) forwards;width:0}
.cmp-bar i.best{background:linear-gradient(90deg,var(--teal),#5eead4)}
@keyframes gw{to{width:var(--w)}}

/* ==================== ANALYSIS ==================== */
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.an-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .35s var(--ease-soft)}
.an-card:hover{border-color:color-mix(in srgb,var(--red) 30%,transparent);transform:translateY(-2px)}
.an-card h4{margin:0 0 6px;font:700 12px var(--font-display);color:var(--text-secondary)}
.an-bar{height:22px;border-radius:8px;overflow:hidden;display:flex;background:var(--surface-2);margin:5px 0}
.an-bar i{display:block;height:100%;transition:width .9s var(--ease-soft);display:grid;place-items:center;font:700 10px var(--font-main);color:#fff}
.an-bar i.home{background:linear-gradient(90deg,var(--red),#f87171)}
.an-bar i.away{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.an-legend{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-tertiary)}
.momentum{display:flex;align-items:flex-end;gap:2px;height:50px;padding:3px 0}
.momentum i{flex:1;border-radius:3px 3px 0 0;min-height:3px;transition:height .6s var(--ease-soft);animation:barIn .7s var(--ease-soft) both}
@keyframes barIn{from{height:0!important}}
.momentum i.pos{background:linear-gradient(180deg,var(--red),#b91c1c)}
.momentum i.neg{background:linear-gradient(180deg,#3b82f6,#1d4ed8)}

/* ==================== MATCH ANALYZE MODAL ==================== */
.an-modal{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;place-items:center;padding:14px}
.an-modal.on{display:grid;animation:fadeIn .3s var(--ease-soft)}
@keyframes fadeIn{from{opacity:0}}
.an-modal-inner{background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:var(--radius-xl);padding:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.7);animation:popIn .5s var(--ease-bounce)}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(10px)}}
.an-modal-inner h3{margin:0 0 12px;font:800 17px var(--font-display);display:flex;align-items:center;justify-content:space-between;gap:10px}
.an-modal-inner h3 .close{background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);width:32px;height:32px;border-radius:12px;cursor:pointer;font-size:14px;display:grid;place-items:center;transition:all .35s var(--ease-soft)}
.an-modal-inner h3 .close:hover{border-color:var(--red);color:var(--red);transform:rotate(90deg) scale(1.05)}
.an-modal-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:14px;padding:12px;background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border)}
.an-modal-head .side{display:flex;align-items:center;gap:8px;min-width:0}
.an-modal-head .side.right{justify-content:flex-end}
.an-modal-head .side .lg{width:36px;height:36px;font-size:13px}
.an-modal-head .side b{font:800 14px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-modal-head .vs{font:800 16px var(--font-display);color:var(--text-tertiary);padding:4px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
.an-modal-score{text-align:center;font:900 28px var(--font-display);letter-spacing:.5px;margin-bottom:10px}
.an-modal-detail{text-align:center;font-size:11px;color:var(--text-tertiary);margin-bottom:14px;font-style:italic}
.an-chance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.an-chance{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 10px;text-align:center;transition:all .4s var(--ease-soft);position:relative;overflow:hidden}
.an-chance:hover{transform:translateY(-2px)}
.an-chance.pick{border-color:var(--teal);background:linear-gradient(135deg,rgba(42,157,143,.15),transparent);box-shadow:0 6px 20px rgba(42,157,143,.15)}
.an-chance .lbl{font:600 9px var(--font-main);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.an-chance .pct{font:800 20px var(--font-display);line-height:1}
.an-chance .odd-line{font:700 11px var(--font-main);color:var(--text-secondary);margin-top:3px}
.an-chance.pick .pct{color:var(--teal)}

/* ==================== BETTING ==================== */
.bet-simple{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:viewEnter .4s var(--ease-soft) both}
.bet-balance-simple{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--red),var(--orange));border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:12px;color:#fff;box-shadow:0 8px 28px rgba(231,111,81,.35)}
.bet-balance-simple .lbl{font-size:9px;opacity:.85;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.bet-balance-simple .val{font:900 22px var(--font-display);line-height:1.1;margin-top:1px}
.bet-balance-simple .btns{display:flex;gap:5px}
.bet-balance-simple button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff;padding:6px 12px;border-radius:10px;font:600 10.5px var(--font-main);cursor:pointer;transition:all .3s var(--ease-soft)}
.bet-balance-simple button:hover{background:rgba(255,255,255,.25);transform:translateY(-1px)}
.bet-simple h3{font:700 14px var(--font-display);margin:0 0 3px}
.bet-simple .hint{font-size:11px;color:var(--text-secondary);margin-bottom:10px}
.bet-toolbar{display:flex;gap:6px;margin-bottom:10px}
.bet-toolbar button{flex:1;padding:8px 10px;border-radius:var(--radius-md);border:1px solid var(--red);background:none;color:var(--red);font:600 11.5px var(--font-main);cursor:pointer;transition:all .35s var(--ease-soft);min-height:34px}
.bet-toolbar button:hover{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;transform:translateY(-2px);box-shadow:0 6px 20px rgba(231,111,81,.4)}
.bet-list{display:flex;flex-direction:column;gap:7px}
.bet-row{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;animation:staggerIn .4s var(--ease-soft) both}
.bet-row .names{display:flex;align-items:center;justify-content:space-between;font:700 12px var(--font-display);margin-bottom:8px;gap:5px}
.bet-row .names .nm{display:flex;align-items:center;gap:5px;min-width:0;flex:1}
.bet-row .names .nm.away{justify-content:flex-end}
.bet-row .names .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet-row .names .lg{width:20px;height:20px;font-size:7px;flex-shrink:0}
.bet-row .names .vs{font:600 8.5px var(--font-main);color:var(--text-tertiary);padding:2px 7px;border-radius:99px;background:var(--surface);border:1px solid var(--border);flex-shrink:0}
.bet-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.bet-btns button{padding:8px 3px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all .35s var(--ease-soft);display:flex;flex-direction:column;align-items:center;gap:1px}
.bet-btns button .lb2{font:600 8px var(--font-main);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.4px}
.bet-btns button .od{font:800 13px var(--font-display);color:var(--red)}
.bet-btns button:hover:not(:disabled){border-color:var(--red);transform:translateY(-2px);box-shadow:0 4px 12px rgba(231,111,81,.25)}
.bet-btns button:active:not(:disabled){transform:scale(.96)}
.bet-btns button:disabled{opacity:.35;cursor:not-allowed}
.bet-btns button.picked{background:linear-gradient(135deg,var(--red),var(--orange));border-color:transparent;box-shadow:0 4px 14px rgba(231,111,81,.4)}
.bet-btns button.picked .lb2{color:rgba(255,255,255,.85)}
.bet-btns button.picked .od{color:#fff}
.bet-log{margin-top:12px}
.bet-log h4{font:700 12.5px var(--font-display);margin:0 0 6px;color:var(--text-secondary)}
.bet-log-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px}
.bet-log-item:last-child{border-bottom:none}
.bet-log-item .nm2{flex:1;min-width:0}
.bet-log-item .nm2 b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet-log-item .nm2 small{color:var(--text-tertiary);font-size:9.5px}
.bet-log-item .res{font:800 11.5px var(--font-display);padding:3px 8px;border-radius:8px;white-space:nowrap}
.bet-log-item .res.win{color:var(--teal);background:rgba(42,157,143,.12)}
.bet-log-item .res.lose{color:var(--danger);background:var(--red-soft)}

.bet-result{position:fixed;inset:0;z-index:50;display:none;place-items:center;pointer-events:none;padding:20px}
.bet-result.on{display:grid}
.bet-result-inner{background:var(--bg-elevated);border:1.5px solid var(--red);border-radius:var(--radius-xl);padding:24px 32px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 60px rgba(231,111,81,.4);animation:resultPop .7s var(--ease-bounce) both;min-width:200px;max-width:85vw}
.bet-result-inner.win{border-color:var(--teal);box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 60px rgba(42,157,143,.4)}
.bet-result-inner.lose{border-color:var(--danger);box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 60px rgba(231,111,81,.4)}
@keyframes resultPop{0%{transform:scale(.5) rotate(-8deg);opacity:0}60%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.bet-result-icon{font-size:44px;margin-bottom:4px;animation:iconBounce .6s var(--ease-bounce)}
@keyframes iconBounce{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.bet-result-text{font:800 20px var(--font-display);margin-bottom:3px}
.bet-result-amount{font:800 17px var(--font-display)}
.bet-result-amount.win{color:var(--teal)}
.bet-result-amount.lose{color:var(--danger)}

#toasts{position:fixed;right:10px;top:calc(60px + env(safe-area-inset-top,0px));z-index:40;display:grid;gap:6px;max-width:min(300px,calc(100vw - 20px))}
.ts{background:var(--bg-elevated);border:1px solid var(--border-strong);border-left:3px solid var(--red);border-radius:var(--radius-md);padding:10px 12px;font-size:11.5px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 20px rgba(231,111,81,.2);animation:tin .45s var(--ease-bounce) both,tout .45s 4.5s var(--ease-soft) forwards}
@keyframes tin{from{transform:translateX(120%) scale(.9);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateX(30%)}}
.fd{padding:8px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:6px;font-size:11.5px}
.fd:first-child{border:0}
.fd small{color:var(--text-tertiary);white-space:nowrap;font-size:10px}
.hh{font:700 14px var(--font-display);margin:16px 0 8px}
.note{margin-top:12px;font-size:11.5px;color:var(--text-tertiary);line-height:1.6;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.note b{color:var(--text-secondary)}

.fs{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.fs.on{display:block;animation:fsIn .45s var(--ease-soft) both}
@keyframes fsIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.fsb{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(7px + env(safe-area-inset-top,0px)) 12px 7px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--border)}

.back:hover{border-color:var(--red);background:var(--surface-2);box-shadow:0 0 12px rgba(231,111,81,.3);transform:translateX(-2px)}
.fsw{max-width:1280px;margin:0 auto;padding:0 12px 80px}

.mobile-table{display:none}
.mt-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--zc,transparent);border-radius:var(--radius-lg);padding:10px 12px;margin-bottom:6px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;cursor:pointer;transition:all .35s var(--ease-soft);animation:staggerIn .4s var(--ease-soft) both}

.mt-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-stats{display:flex;gap:6px;font-size:10px;color:var(--text-secondary)}
.mt-stats b{color:var(--text);font-weight:600}
.mt-pts{font:800 17px var(--font-display);color:var(--red)}

async function fetchTeamLogo(name){
  if(TEAM_LOGO_CACHE[name] !== undefined) return TEAM_LOGO_CACHE[name];
  const en = TEAM_EN[name] || name;
  try{
    const r = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(en)}`);
    if(!r.ok){TEAM_LOGO_CACHE[name]=null;return null}
    const j = await r.json();
    const t = j.teams && j.teams[0];
    if(t && t.strTeamBadge){TEAM_LOGO_CACHE[name]=t.strTeamBadge;return t.strTeamBadge}
    TEAM_LOGO_CACHE[name]=null;
  }catch(e){TEAM_LOGO_CACHE[name]=null}
  return null;
}

let logoObserver = null;
function initLogoObserver(){
  if(!('IntersectionObserver' in window)) return;
  logoObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const el = entry.target;
        logoObserver.unobserve(el);
        applyTeamLogo(el, el.dataset.logo, el.dataset.color);
      }
    });
  },{rootMargin:"100px"});
}
function observeLogos(){
  if(!logoObserver){

function getXG(team){const base = team.p / team.g * 1.2;const variance = (team.n.length % 5) * 0.15;return +(base + variance).toFixed(2);}
function getXGAgainst(team){const base = (team.ga || 1) / team.g * 1.1;const variance = (team.n.length % 3) * 0.1;return +(base + variance).toFixed(2);}
function getMomentum(team, other){const bars=[];const seed=team.n.length+other.n.length;for(let i=0;i<12;i++){const v=Math.sin(seed+i*0.8)*0.5+0.5;const diff=(team.p-other.p)/Math.max(1,team.p+other.p);const val=Math.max(0,Math.min(1,v+diff*0.3));bars.push({home:val,away:1-val});}return bars;}

/* === СТАВКИ === */
function betMatches(){
  const a = T();
  const pairs = [];
  const offset = (betRound*3) % Math.max(1,a.length-4);
  for(let i=0;i<3;i++){
    const hi = (i+offset) % a.length, li = (i+offset+4) % a.length;
    if(hi===li)continue;
    pairs.push({home: a[hi], away: a[li]});
  }
  return pairs;
}
function calcOdds(home,away){
  const sH = home.p/home.g, sA = away.p/away.g;
  const diff = sH - sA;
  let pHome = 0.4 + diff*0.16, pDraw = 0.26 - Math.abs(diff)*0.06, pAway = 1 - pHome - pDraw;
  pHome = Math.max(0.05,Math.min(0.85,pHome));pDraw = Math.max(0.08,Math.min(0.35,pDraw));pAway = Math.max(0.05,Math.min(0.85,1-pHome-pDraw));
  const sum = pHome+pDraw+pAway; pHome/=sum;pDraw/=sum;pAway/=sum;
  return {pHome,pDraw,pAway,oddsHome:+(1.05/pHome).toFixed(2),oddsDraw:+(1.05/pDraw).toFixed(2),oddsAway:+(1.05/pAway).toFixed(2)};
}
function simulate(prob, outcome){const r=Math.random();let result;if(r<prob.pHome)result=0;else if(r<prob.pHome+prob.pDraw)result=1;else result=2;return{result,win:result===outcome};}
function placeBet(match, outcome, betOdds){
  const amount = 100;
  if(betBalance < amount) return {error:"Недостаточно средств"};
  const prob = calcOdds(match.home, match.away);
  const sim = simulate(prob, outcome);
  betBalance -= amount; let payout = 0;
  if(sim.win){payout = Math.round(amount * betOdds);betBalance += payout;}
  const record = {match:`${match.home.n} — ${match.away.n}`,outcome:outcome===0?"П1":outcome===1?"X":"П2",amount,odds:betOdds,status:sim.win?"win":"lose",payout,timestamp:Date.now()};
  betHistory.unshift(record);betHistory = betHistory.slice(0,20);save();
  return {win: sim.win, payout, amount};
}

}

  else log.innerHTML = betHistory.slice(0,6).map(h=>`<div class="bet-log-item"><div class="nm2"><b>${h.match}</b><small>${h.outcome} · ${h.odds}</small></div><div class="res ${h.status}">${h.status==='win'?'+'+(h.payout-h.amount):'-'+h.amount} 🪙</div></div>`).join("");

    const p = document.createElement("div");
    p.className = "particle "+types[Math.floor(Math.random()*types.length)];
    p.style.left = Math.random()*100+"%";
    p.style.animationDuration = (8+Math.random()*14)+"s";
    p.style.animationDelay = (-Math.random()*22)+"s";
    const col = fireColors[Math.floor(Math.random()*fireColors.length)];
    p.style.background = col;
    p.style.boxShadow = `0 0 8px ${col}, 0 0 16px ${col}80`;
    p.style.setProperty("--drift", (Math.random()*50-25)+"px");
    frag.appendChild(p);
  }
  c.appendChild(frag);
}

let scrollTicking = false;
addEventListener("scroll",()=>{
  if(!scrollTicking){requestAnimationFrame(()=>{$("#hd").classList.toggle("scrolled",scrollY>20);scrollTicking = false;});scrollTicking = true;}
},{passive:true});

load();paint();lgbar();hero();R();badge();check();initParticles();initLogoObserver();
</script>
