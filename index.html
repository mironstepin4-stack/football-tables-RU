<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0d1b2a">
<title>Футбол PRO · Live Score & xG</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1b2a; --bg-elevated:#1b263b;
  --surface:rgba(255,255,255,.05); --surface-2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.1); --border-strong:rgba(255,255,255,.16);
  --text:#f5f0fa; --text-secondary:#a094b0; --text-tertiary:#6b5f7a;
  --red:#e76f51; --orange:#f4a261; --teal:#2a9d8f; --blue:#4a9eff;
  --red-soft:rgba(231,111,81,.15); --teal-soft:rgba(42,157,143,.15);
  --success:#2a9d8f; --danger:#e76f51; --draw:#6b7280;
  --font-main:'Inter',system-ui,-apple-system,sans-serif;
  --font-display:'Space Grotesk','Inter',sans-serif;
  --radius-lg:16px; --radius-md:12px; --radius-sm:8px;
}
:root[data-theme="light"]{
  --bg:#faf5f7; --bg-elevated:#ffffff; --surface:rgba(0,0,0,.04); --surface-2:rgba(0,0,0,.06);
  --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14); --text:#1a0f14; --text-secondary:#6b5f7a; --text-tertiary:#a094b0;
  --red:#c1121f; --red-soft:rgba(193,18,31,.1); --teal:#0a9396; --teal-soft:rgba(10,147,150,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font-main);overflow-x:hidden;overscroll-behavior-y:none;min-height:100vh}

.bg-layer{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(ellipse 70% 55% at 15% -10%, rgba(231,111,81,.25), transparent 65%),
  radial-gradient(ellipse 55% 45% at 85% 110%, rgba(42,157,143,.2), transparent 65%),
  radial-gradient(ellipse 40% 30% at 50% 50%, rgba(244,162,97,.06), transparent 70%), var(--bg)}
.bg-layer::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 30% 20%, rgba(244,162,97,.08), transparent 40%),
  radial-gradient(circle at 70% 80%, rgba(42,157,143,.1), transparent 40%);
  animation:auroraShift 20s ease-in-out infinite alternate}
@keyframes auroraShift{0%{transform:scale(1) rotate(0deg);opacity:.7}50%{transform:scale(1.15) rotate(3deg);opacity:1}100%{transform:scale(1.05) rotate(-2deg);opacity:.85}}
.bg-layer::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0);background-size:36px 36px;mask-image:radial-gradient(ellipse at 50% 30%, black 20%, transparent 80%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%, black 20%, transparent 80%);pointer-events:none}
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particle{position:absolute;border-radius:50%;animation:sparkRise linear infinite,sparkFlicker 1.8s ease-in-out infinite;will-change:transform,opacity}
.particle.tiny{width:2px;height:2px}.particle.small{width:3px;height:3px}.particle.medium{width:4px;height:4px}.particle.large{width:6px;height:6px;filter:blur(.4px)}
@keyframes sparkRise{0%{transform:translateY(105vh) translateX(0) scale(.4);opacity:0}8%{opacity:1}40%{transform:translateY(60vh) translateX(var(--drift,10px)) scale(1);opacity:.85}70%{transform:translateY(30vh) translateX(calc(var(--drift,10px) * -0.6)) scale(.9);opacity:.6}100%{transform:translateY(-10vh) translateX(var(--drift,10px)) scale(.3);opacity:0}}
@keyframes sparkFlicker{0%,100%{filter:brightness(1) hue-rotate(0deg)}25%{filter:brightness(1.6) hue-rotate(15deg)}50%{filter:brightness(.85) hue-rotate(-10deg)}75%{filter:brightness(1.4) hue-rotate(5deg)}}

.hd{position:sticky;top:0;z-index:20;backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);background:color-mix(in srgb,var(--bg) 75%,transparent);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px);transition:box-shadow .3s,border-color .3s}
.hd.scrolled{box-shadow:0 6px 32px rgba(231,111,81,.15),0 4px 24px rgba(0,0,0,.4);border-bottom-color:color-mix(in srgb,var(--red) 30%,transparent)}
.hdi{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:6px;font:800 17px var(--font-display);white-space:nowrap;letter-spacing:-.3px}
.brand .ball{font-size:20px;filter:drop-shadow(0 0 8px rgba(231,111,81,.7)) drop-shadow(0 0 12px rgba(244,162,97,.4));animation:ballSpin 6s linear infinite}
@keyframes ballSpin{to{transform:rotate(360deg)}}
.lgs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 0;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.lgs::-webkit-scrollbar{display:none}
.lb{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font:600 13px var(--font-main);cursor:pointer;white-space:nowrap;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.lb span{font-size:15px}
.lb:hover{color:var(--text);background:var(--surface-2);transform:translateY(-1px)}
.lb.on{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(231,111,81,.5);transform:scale(1.03)}
.tg{display:flex;gap:6px;align-items:center}
.ic{padding:8px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:15px;min-width:38px;min-height:38px;display:grid;place-items:center;transition:all .25s}
.ic:hover{background:var(--surface-2);border-color:var(--red);box-shadow:0 0 16px rgba(231,111,81,.35);transform:translateY(-1px)}
.pf{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:600 12px var(--font-main);cursor:pointer;transition:all .25s}
.pf:hover{border-color:var(--red);box-shadow:0 0 12px rgba(231,111,81,.3)}
.pf img,.gi{width:28px;height:28px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--surface-2);font-size:14px}

.w{max-width:1280px;margin:0 auto;padding:20px 16px 100px}
h1{font:800 clamp(24px,5vw,40px)/1.1 var(--font-display);margin:4px 0 0;letter-spacing:-.5px;background:linear-gradient(135deg,var(--text) 0%,var(--red) 50%,var(--orange) 100%);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradientShift 8s ease infinite}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sub{color:var(--text-secondary);font-size:13px;margin-top:6px}

.hero{margin:14px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.k{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--red),var(--orange));border-radius:0 3px 3px 0;transition:width .3s}
.k:hover{transform:translateY(-3px) scale(1.02);border-color:color-mix(in srgb,var(--red) 40%,transparent);box-shadow:0 12px 32px rgba(231,111,81,.25),0 4px 12px rgba(0,0,0,.3)}
.k:hover::before{width:5px}
.k b{display:block;font:800 18px var(--font-display);line-height:1.2}
.k span{font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.8px;font-weight:600}

.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:4px;width:fit-content;max-width:100%;overflow-x:auto;margin-bottom:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--text-secondary);padding:10px 16px;border-radius:var(--radius-sm);font:600 13px var(--font-main);cursor:pointer;white-space:nowrap;transition:all .25s}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;box-shadow:0 4px 16px rgba(231,111,81,.45);transform:scale(1.02)}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-top:1px solid var(--border);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(6,1fr);gap:0}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--text-tertiary);padding:7px 2px;border-radius:10px;font:600 9px var(--font-main);cursor:pointer;transition:all .25s;min-height:50px;position:relative}
.bottom-nav button .bi{font-size:17px;line-height:1;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.bottom-nav button.on{color:var(--red)}
.bottom-nav button.on .bi{transform:scale(1.15)}
.bottom-nav button.on::before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--red),var(--orange));box-shadow:0 0 10px var(--red);animation:tabIndicator .3s ease}
@keyframes tabIndicator{from{width:0;opacity:0}}

.view-enter{animation:viewEnter .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes viewEnter{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.stagger-item{animation:staggerIn .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes staggerIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{padding:10px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font:14px var(--font-main);outline:none;transition:all .25s;-webkit-appearance:none}
input{flex:1;min-width:140px}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft),0 0 20px rgba(231,111,81,.2)}
.ch{padding:7px 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font:600 12px var(--font-main);cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);min-height:32px}
.ch:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}
.ch.on{color:#fff;background:var(--zc,var(--red));border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--zc,var(--red)) 45%,transparent);transform:scale(1.05)}

/* ==================== COMPACT TABLE ==================== */
.compact-table{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:staggerIn .5s cubic-bezier(.34,1.56,.64,1) both}
.compact-table table{width:100%;border-collapse:collapse;table-layout:fixed}
.compact-table thead th{font-size:9px;color:var(--text-tertiary);padding:6px 4px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;background:var(--surface);border-bottom:1px solid var(--border);text-align:center;cursor:pointer;user-select:none;transition:color .2s}
.compact-table thead th:hover{color:var(--red)}
.compact-table thead th:first-child{text-align:left;padding-left:10px;width:32px}
.compact-table thead th:nth-child(2){text-align:left;padding-left:2px}
.compact-table tbody td{padding:6px 4px;text-align:center;font-size:12px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.compact-table tbody td:first-child{text-align:left;padding-left:10px;font-weight:800;color:var(--text-tertiary);font-size:11px;width:32px}
.compact-table tbody td:nth-child(2){text-align:left;padding-left:2px;overflow:hidden}
.compact-table tbody tr{cursor:pointer;transition:background .15s;position:relative}
.compact-table tbody tr::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--zc,transparent);opacity:.7}
.compact-table tbody tr:hover{background:color-mix(in srgb,var(--red) 6%,transparent)}
.compact-table .team-cell{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;min-width:0}
.compact-table .team-cell .lg{width:20px;height:20px;font-size:7px;flex-shrink:0}
.compact-table .team-cell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compact-table .pts{font:800 14px var(--font-display);color:var(--red)}
.compact-table .gd{font-weight:700;font-size:11px}
.compact-table .gd.up{color:var(--success)}
.compact-table .gd.dn{color:var(--danger)}
.compact-table .st{font-size:14px;padding:0;min-width:20px}

/* ==================== MATCH LIST ==================== */
.match-section{margin-top:14px;animation:staggerIn .5s cubic-bezier(.34,1.56,.64,1) .1s both}
.match-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 4px}
.match-section-head h2{margin:0;font:700 14px var(--font-display);display:flex;align-items:center;gap:6px}
.match-section-head .cnt{font:600 10px var(--font-main);color:var(--text-tertiary);background:var(--surface);padding:3px 9px;border-radius:99px;border:1px solid var(--border)}
.match-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.match-item{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;transition:background .15s;animation:staggerIn .35s cubic-bezier(.34,1.56,.64,1) both}
.match-item:last-child{border-bottom:none}
.match-item:hover{background:color-mix(in srgb,var(--red) 5%,transparent)}
.match-item .mt-team{display:flex;align-items:center;gap:5px;min-width:0;font-weight:600}
.match-item .mt-team.home{justify-content:flex-end;text-align:right}
.match-item .mt-team.away{justify-content:flex-start;text-align:left}
.match-item .mt-team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-item .mt-team .lg{width:18px;height:18px;font-size:7px;flex-shrink:0}
.match-item .mt-score{font:800 13px var(--font-display);padding:2px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);min-width:44px;text-align:center;letter-spacing:.3px}
.match-item.win-home .mt-score{background:rgba(42,157,143,.15);border-color:rgba(42,157,143,.35);color:var(--teal)}
.match-item.win-away .mt-score{background:rgba(74,158,255,.15);border-color:rgba(74,158,255,.35);color:var(--blue)}
.match-item.draw .mt-score{background:rgba(107,114,128,.15);border-color:rgba(107,114,128,.3);color:#9ca3af}
.match-item .mt-detail{font-size:9px;color:var(--text-tertiary);text-align:center;margin-top:2px;grid-column:1/-1}

/* ==================== TEAM VIEW (REDESIGNED) ==================== */
.team-page{animation:viewEnter .4s cubic-bezier(.34,1.56,.64,1) both}
.team-hero{position:relative;border-radius:var(--radius-lg);padding:20px 18px;margin-bottom:14px;overflow:hidden;border:1px solid var(--border);background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 35%,transparent),transparent 65%)}
.team-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,var(--zc) 0%,transparent 60%);opacity:.1;pointer-events:none}
.team-hero .big-num{position:absolute;right:14px;top:-14px;font:900 clamp(70px,16vw,130px)/1 var(--font-display);color:var(--zc);opacity:.13;pointer-events:none}
.team-hero-inner{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.team-hero-inner .lg{width:60px;height:60px;font-size:22px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.team-hero-inner h2{font:800 clamp(20px,4.5vw,32px)/1.1 var(--font-display);margin:0;letter-spacing:-.5px}
.team-hero-inner .meta{font-size:12px;color:var(--text-secondary);margin-top:4px}
.team-hero-inner .zone{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:99px;font:700 10px var(--font-main);background:color-mix(in srgb,var(--zc) 18%,transparent);color:var(--zc);border:1px solid color-mix(in srgb,var(--zc) 40%,transparent)}

.team-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:14px}
.team-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 10px;text-align:center;transition:all .25s;position:relative;overflow:hidden}
.team-stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--red),var(--orange));opacity:.7}
.team-stat:hover{border-color:color-mix(in srgb,var(--red) 35%,transparent);transform:translateY(-2px)}
.team-stat b{display:block;font:800 20px var(--font-display);line-height:1.1;margin-bottom:2px}
.team-stat span{font-size:9.5px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.6px;font-weight:600}

.team-form{margin-bottom:14px}
.team-form-label{font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:6px}
.team-form-bar{display:flex;gap:3px;height:10px;border-radius:5px;overflow:hidden}
.team-form-bar i{display:block;transition:flex .5s}

.team-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.team-section h3{margin:0 0 12px;font:700 15px var(--font-display);display:flex;align-items:center;gap:8px}
.team-section h3 .icon{font-size:16px}

/* Mini pitch */
.mini-pitch{position:relative;width:100%;max-width:460px;aspect-ratio:5/6;margin:0 auto 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.3);background:repeating-linear-gradient(0deg,#1a6b42 0 10%,#1e7a4c 10% 20%);box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);overflow:hidden}
.mini-pitch .line{position:absolute;border:1.5px solid rgba(255,255,255,.25);pointer-events:none}
.mini-pitch .mid-h{left:0;right:0;top:50%;border-width:1.5px 0 0}
.mini-pitch .cc{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:1.5px solid rgba(255,255,255,.25);border-radius:50%}
.mini-pitch .box-t{position:absolute;left:22%;width:56%;height:11%;top:0;border:1.5px solid rgba(255,255,255,.25);border-top:0}
.mini-pitch .box-b{position:absolute;left:22%;width:56%;height:11%;bottom:0;border:1.5px solid rgba(255,255,255,.25);border-bottom:0}
.mini-pitch .goal-t{position:absolute;left:38%;width:24%;height:2%;top:0;border:1.5px solid rgba(255,255,255,.35);border-top:0}
.mini-pitch .goal-b{position:absolute;left:38%;width:24%;height:2%;bottom:0;border:1.5px solid rgba(255,255,255,.35);border-bottom:0}

.player-dot{position:absolute;width:clamp(34px,9vw,46px);height:clamp(34px,9vw,46px);transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;border:2.5px solid var(--c,#fff);background:#1a2035;box-shadow:0 4px 14px rgba(0,0,0,.55);transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;animation:dotIn .45s cubic-bezier(.34,1.56,.64,1) both;z-index:3;overflow:hidden}
.player-dot:hover{transform:translate(-50%,-50%) scale(1.18);z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.7),0 0 22px var(--c)}
.player-dot img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.player-dot .fallback{width:100%;height:100%;display:grid;place-items:center;font:800 13px var(--font-display);color:#fff;background:linear-gradient(135deg,var(--c),rgba(0,0,0,.4))}
.player-dot .num{position:absolute;right:-3px;bottom:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--c);color:#0a0e1a;font:800 8.5px var(--font-main);display:grid;place-items:center;padding:0 3px;border:2px solid #0a0e1a;z-index:2}
.player-dot .nm-tag{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font:600 8.5px var(--font-main);color:#fff;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.player-dot:hover .nm-tag{opacity:1}
@keyframes dotIn{from{opacity:0;transform:translate(-50%,-50%) scale(0)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* Player list */
.player-list{display:grid;gap:6px}
.player-card{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border);transition:all .2s;animation:staggerIn .35s cubic-bezier(.34,1.56,.64,1) both}
.player-card:hover{border-color:color-mix(in srgb,var(--red) 30%,transparent);transform:translateX(3px);background:color-mix(in srgb,var(--red) 4%,var(--surface-2))}
.player-card .pav{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid var(--pc,#666);cursor:pointer;position:relative;background:#1a2035}
.player-card .pav img{width:100%;height:100%;object-fit:cover;display:block}
.player-card .pav .fallback{width:100%;height:100%;display:grid;place-items:center;font:800 12px var(--font-display);color:#fff;background:linear-gradient(135deg,var(--pc),rgba(0,0,0,.4))}
.player-card .pinfo{flex:1;min-width:0}
.player-card .pname{font:700 13px var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-card .pmeta{font-size:10.5px;color:var(--text-tertiary);margin-top:1px;display:flex;gap:6px;align-items:center}
.player-card .pmeta .pos-badge{padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--pc) 18%,transparent);color:var(--pc);font-weight:700;font-size:9.5px}
.player-card .rating{font:800 12px var(--font-display);padding:3px 7px;border-radius:6px;color:#fff}
.player-card .rating.great{background:linear-gradient(135deg,#10b981,#059669)}
.player-card .rating.good{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.player-card .rating.avg{background:linear-gradient(135deg,#f59e0b,#d97706)}
.player-card .rating.poor{background:linear-gradient(135deg,#ef4444,#dc2626)}
.player-card .rm{border:0;background:none;color:var(--text-tertiary);cursor:pointer;padding:3px 5px;font-size:11px;border-radius:4px}
.player-card .rm:hover{color:var(--danger);background:var(--red-soft)}

.player-group-title{font:700 12px var(--font-display);color:var(--text-secondary);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.player-group-title:first-child{margin-top:0}
.player-group-title .dot-c{width:8px;height:8px;border-radius:50%;background:var(--gc)}

/* Team matches */
.team-matches{display:grid;gap:6px}
.tm-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 11px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border);font-size:12px;transition:all .2s}
.tm-row:hover{border-color:color-mix(in srgb,var(--red) 25%,transparent)}
.tm-row .tt{display:flex;align-items:center;gap:5px;min-width:0;font-weight:600}
.tm-row .tt.home{justify-content:flex-end}
.tm-row .tt.away{justify-content:flex-start}
.tm-row .tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-row .tt .lg{width:18px;height:18px;font-size:7px}
.tm-row .sc{font:800 13px var(--font-display);padding:2px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--border);min-width:40px;text-align:center}
.tm-row .sc.win{background:rgba(42,157,143,.15);border-color:rgba(42,157,143,.35);color:var(--teal)}
.tm-row .sc.lose{background:rgba(231,111,81,.15);border-color:rgba(231,111,81,.35);color:var(--danger)}
.tm-row .dt{grid-column:1/-1;font-size:9px;color:var(--text-tertiary);text-align:center;margin-top:1px}

/* Next match card */
.next-match{background:linear-gradient(135deg,color-mix(in srgb,var(--red) 12%,transparent),color-mix(in srgb,var(--orange) 6%,transparent));border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.next-match .ic2{font-size:22px;flex-shrink:0}
.next-match .txt{flex:1;min-width:0}
.next-match .txt b{display:block;font:700 13px var(--font-display);margin-bottom:2px}
.next-match .txt small{font-size:11px;color:var(--text-secondary)}

/* Near table */
.near-table{display:grid;gap:5px}
.near-row{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.near-row:hover{border-color:color-mix(in srgb,var(--red) 35%,transparent);transform:translateX(3px)}
.near-row.me{border-color:var(--red);background:linear-gradient(135deg,color-mix(in srgb,var(--red) 10%,transparent),transparent)}
.near-row .rn{font:800 13px var(--font-display);color:var(--text-tertiary);width:20px;text-align:center}
.near-row .lg{width:22px;height:22px;font-size:8px}
.near-row span{flex:1;font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.near-row strong{font:800 14px var(--font-display);color:var(--red)}

/* ==================== OTHER VIEWS ==================== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cd{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:all .35s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;animation:staggerIn .4s cubic-bezier(.34,1.56,.64,1) both}
.cd::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--zc) 0%,transparent 70%);opacity:0;transition:opacity .35s}
.cd:hover{transform:translateY(-6px) scale(1.02);border-color:color-mix(in srgb,var(--red) 40%,transparent);box-shadow:0 20px 48px rgba(0,0,0,.35),0 0 40px rgba(231,111,81,.18)}
.cd:hover::before{opacity:.12}
.cd .rk{position:absolute;right:12px;top:2px;font:900 52px var(--font-display);color:var(--zc);opacity:.12;transition:opacity .35s,transform .35s}
.cd:hover .rk{opacity:.25;transform:scale(1.05)}
.cd h4{margin:10px 0 3px;font:700 16px var(--font-display);position:relative}
.cd small{color:var(--text-secondary);font-size:12px;position:relative}
.cd .st{position:absolute;right:12px;bottom:10px;z-index:2}

.lg{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.lg img{width:100%;height:100%;object-fit:contain;padding:2px}
.st{cursor:pointer;color:var(--text-tertiary);font-size:17px;transition:all .3s cubic-bezier(.34,1.56,.64,1);opacity:.5;display:inline-block;padding:2px;min-width:28px;text-align:center}
.st:hover{transform:scale(1.3);opacity:1}
.st.on{color:var(--orange);opacity:1;text-shadow:0 0 12px var(--orange)}

/* ==================== ANALYSIS ==================== */
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.an-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .25s}
.an-card:hover{border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.an-card h4{margin:0 0 8px;font:700 13px var(--font-display);color:var(--text-secondary)}
.an-bar{height:24px;border-radius:6px;overflow:hidden;display:flex;background:var(--surface-2);margin:6px 0}
.an-bar i{display:block;height:100%;transition:width .8s cubic-bezier(.34,1.56,.64,1);display:grid;place-items:center;font:700 10px var(--font-main);color:#fff}
.an-bar i.home{background:linear-gradient(90deg,var(--red),#f87171)}
.an-bar i.away{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.an-legend{display:flex;justify-content:space-between;font-size:10px;color:var(--text-tertiary)}
.momentum{display:flex;align-items:flex-end;gap:2px;height:60px;padding:4px 0}
.momentum i{flex:1;border-radius:2px 2px 0 0;min-height:4px;transition:height .5s cubic-bezier(.34,1.56,.64,1);animation:barIn .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes barIn{from{height:0!important}}
.momentum i.pos{background:linear-gradient(180deg,var(--red),#b91c1c)}
.momentum i.neg{background:linear-gradient(180deg,#3b82f6,#1d4ed8)}

/* ==================== BETTING ==================== */
.bet-simple{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:viewEnter .35s cubic-bezier(.34,1.56,.64,1) both}
.bet-balance-simple{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--red),var(--orange));border-radius:var(--radius-md);padding:14px 18px;margin-bottom:14px;color:#fff;box-shadow:0 8px 28px rgba(231,111,81,.35)}
.bet-balance-simple .lbl{font-size:10px;opacity:.85;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.bet-balance-simple .val{font:900 24px var(--font-display);line-height:1.1;margin-top:2px}
.bet-balance-simple button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff;padding:7px 12px;border-radius:8px;font:600 11px var(--font-main);cursor:pointer;transition:all .2s}
.bet-balance-simple button:hover{background:rgba(255,255,255,.25)}
.bet-simple h3{font:700 15px var(--font-display);margin:0 0 4px}
.bet-simple .hint{font-size:11.5px;color:var(--text-secondary);margin-bottom:12px}
.bet-list{display:flex;flex-direction:column;gap:8px}
.bet-row{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;animation:staggerIn .4s cubic-bezier(.34,1.56,.64,1) both}
.bet-row .names{display:flex;align-items:center;justify-content:space-between;font:700 13px var(--font-display);margin-bottom:8px;gap:6px}
.bet-row .names .nm{display:flex;align-items:center;gap:5px;min-width:0;flex:1}
.bet-row .names .nm.away{justify-content:flex-end}
.bet-row .names .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet-row .names .lg{width:22px;height:22px;font-size:8px;flex-shrink:0}
.bet-row .names .vs{font:600 9px var(--font-main);color:var(--text-tertiary);padding:2px 6px;border-radius:99px;background:var(--surface);border:1px solid var(--border);flex-shrink:0}
.bet-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.bet-btns button{padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;align-items:center;gap:1px}
.bet-btns button .lb2{font:600 8.5px var(--font-main);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.4px}
.bet-btns button .od{font:800 14px var(--font-display);color:var(--red)}
.bet-btns button:hover:not(:disabled){border-color:var(--red);transform:translateY(-1px);box-shadow:0 4px 12px rgba(231,111,81,.25)}
.bet-btns button:active:not(:disabled){transform:scale(.96)}
.bet-btns button:disabled{opacity:.35;cursor:not-allowed}
.bet-btns button.picked{background:linear-gradient(135deg,var(--red),var(--orange));border-color:transparent}
.bet-btns button.picked .lb2{color:rgba(255,255,255,.85)}
.bet-btns button.picked .od{color:#fff}
.bet-log{margin-top:14px}
.bet-log h4{font:700 13px var(--font-display);margin:0 0 8px;color:var(--text-secondary)}
.bet-log-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:11.5px}
.bet-log-item:last-child{border-bottom:none}
.bet-log-item .nm2{flex:1;min-width:0}
.bet-log-item .nm2 b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet-log-item .nm2 small{color:var(--text-tertiary);font-size:10px}
.bet-log-item .res{font:800 12px var(--font-display);padding:3px 7px;border-radius:6px;white-space:nowrap}
.bet-log-item .res.win{color:var(--teal);background:rgba(42,157,143,.12)}
.bet-log-item .res.lose{color:var(--danger);background:var(--red-soft)}

.bet-result{position:fixed;inset:0;z-index:50;display:none;place-items:center;pointer-events:none;padding:20px}
.bet-result.on{display:grid}
.bet-result-inner{background:var(--bg-elevated);border:1.5px solid var(--red);border-radius:var(--radius-lg);padding:28px 36px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 60px rgba(231,111,81,.4);animation:resultPop .6s cubic-bezier(.34,1.56,.64,1) both;min-width:220px;max-width:85vw}
.bet-result-inner.win{border-color:var(--teal);box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 60px rgba(42,157,143,.4)}
.bet-result-inner.lose{border-color:var(--danger);box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 60px rgba(231,111,81,.4)}
@keyframes resultPop{0%{transform:scale(.5) rotate(-8deg);opacity:0}60%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.bet-result-icon{font-size:52px;margin-bottom:6px;animation:iconBounce .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes iconBounce{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.bet-result-text{font:800 22px var(--font-display);margin-bottom:4px}
.bet-result-amount{font:800 18px var(--font-display)}
.bet-result-amount.win{color:var(--teal)}
.bet-result-amount.lose{color:var(--danger)}

#toasts{position:fixed;right:12px;top:calc(64px + env(safe-area-inset-top,0px));z-index:40;display:grid;gap:8px;max-width:min(320px,calc(100vw - 24px))}
.ts{background:var(--bg-elevated);border:1px solid var(--border-strong);border-left:3px solid var(--red);border-radius:var(--radius-md);padding:11px 14px;font-size:12px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 20px rgba(231,111,81,.2);animation:tin .4s cubic-bezier(.34,1.56,.64,1) both,tout .4s 4.5s forwards}
@keyframes tin{from{transform:translateX(120%) scale(.9);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateX(30%)}}
.fd{padding:10px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;font-size:12px}
.fd:first-child{border:0}
.fd small{color:var(--text-tertiary);white-space:nowrap;font-size:11px}
.prof{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prof img,.prof .gi{width:56px;height:56px;border:2px solid var(--red);box-shadow:0 0 20px rgba(231,111,81,.4)}
.hh{font:700 16px var(--font-display);margin:20px 0 10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;gap:8px;margin:10px 0;font-size:12px;color:var(--text-secondary);text-align:center}
.bw{height:10px;background:rgba(127,127,160,.12);border-radius:5px;overflow:hidden;display:flex}
.bw.l{justify-content:flex-end}
.bw i{display:block;height:100%;border-radius:5px;width:0;animation:gw .9s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes gw{to{width:var(--w)}}
.note{margin-top:16px;font-size:12px;color:var(--text-tertiary);line-height:1.65;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.note b{color:var(--text-secondary)}

/* Mobile table cards */
.mobile-table{display:none}
.mt-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--zc,transparent);border-radius:var(--radius-md);padding:11px 13px;margin-bottom:7px;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;cursor:pointer;transition:all .25s;animation:staggerIn .4s cubic-bezier(.34,1.56,.64,1) both}
.mt-card:active{transform:scale(.98)}
.mt-pos{font:800 19px var(--font-display);color:var(--text-tertiary);min-width:26px;text-align:center}
.mt-name{display:flex;align-items:center;gap:6px;font:700 13px var(--font-display);margin-bottom:2px}
.mt-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-stats{display:flex;gap:7px;font-size:10.5px;color:var(--text-secondary)}
.mt-stats b{color:var(--text);font-weight:600}
.mt-pts{font:800 19px var(--font-display);color:var(--red)}
.mt-zone{display:inline-block;margin-top:2px;font-size:8.5px;padding:2px 5px;border-radius:4px;background:color-mix(in srgb,var(--zc) 18%,transparent);color:var(--zc);font-weight:700}

@media (max-width:720px){
  .w{padding:14px 12px 90px}
  .hdi{padding:7px 12px;gap:7px}
  .brand{font-size:15px}
  .brand .ball{font-size:17px}
  .pf span:last-child{display:none}
  .pf{padding:4px}
  .lgs{gap:4px}
  .lb{padding:6px 10px;font-size:11.5px}
  .lb span{font-size:13px}
  .tabs{display:none}
  .bottom-nav{display:grid}
  .compact-table{display:none}
  .mobile-table{display:block}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .cd{padding:12px;border-radius:12px}
  .cd h4{font-size:14px;margin:6px 0 2px}
  .cd .rk{font-size:38px;right:8px;top:1px}
  .cd small{font-size:10.5px}
  .cmp{grid-template-columns:1fr;gap:6px}
  .row{grid-template-columns:1fr 60px 1fr;font-size:11px}
  .bet-simple{padding:12px;border-radius:14px}
  .bet-balance-simple{padding:12px 14px}
  .bet-balance-simple .val{font-size:20px}
  .team-hero{padding:16px 14px}
  .team-hero-inner .lg{width:50px;height:50px;font-size:18px}
  .team-stat b{font-size:17px}
  .team-stat span{font-size:8.5px}
  .player-card{padding:8px 9px;gap:8px}
  .player-card .pav{width:34px;height:34px}
  .player-card .pname{font-size:12px}
  .mini-pitch{max-width:100%}
  #toasts{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));right:10px;left:10px;max-width:none}
  .ts{font-size:11.5px;padding:9px 11px}
  h1{font-size:clamp(20px,5.5vw,28px)}
  .sub{font-size:11.5px}
  .note{font-size:11px;padding:11px 13px}
  .match-item{padding:7px 10px;font-size:11.5px;gap:6px}
  .match-item .mt-score{font-size:12px;padding:2px 7px;min-width:38px}
  .match-item .mt-team .lg{width:16px;height:16px;font-size:6px}
}
@media (max-width:380px){
  .k b{font-size:16px}
  .bottom-nav button{font-size:8px}
  .bottom-nav button .bi{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition-duration:.01s!important}}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--red),var(--orange))}
</style>
</head>
<body>
<div class="bg-layer"><div class="particles" id="particles"></div></div>

<header class="hd" id="hd">
  <div class="hdi">
    <div class="brand"><span class="ball">⚽</span><b>Футбол PRO</b></div>
    <div class="lgs" id="lgs"></div>
    <div class="tg">
      <button class="pf" id="pf"></button>
      <button class="ic" id="bl" title="Уведомления" style="position:relative">🔔<b id="bd" style="position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:none;place-items:center;padding:0 3px"></b></button>
      <button class="ic" id="th" title="Тема">◐</button>
    </div>
  </div>
</header>

<main class="w">
  <h1 id="ttl"></h1>
  <div class="sub" id="upd"></div>
  <div class="hero" id="hero"></div>
  <div class="tabs" id="tabs">
    <button class="on" data-v="t">📊 Таблица</button>
    <button data-v="c">🏟️ Клубы</button>
    <button data-v="a">📈 Анализ</button>
    <button data-v="b">🎲 Ставки</button>
    <button data-v="w">★ Мои клубы</button>
  </div>
  <div id="v"></div>
  <div class="note">
    <b>О данных.</b> Таблицы РПЛ — после 9 туров. Остальные лиги — по данным на 7 октября 2026.

  </div>
</main>

<nav class="bottom-nav" id="bottomNav">
  <button class="on" data-v="t"><span class="bi">📊</span><span>Таблица</span></button>
  <button data-v="c"><span class="bi">🏟️</span><span>Клубы</span></button>
  <button data-v="a"><span class="bi">📈</span><span>Анализ</span></button>
  <button data-v="b"><span class="bi">🎲</span><span>Ставки</span></button>
  <button data-v="w"><span class="bi">★</span><span>Мои</span></button>
</nav>

let logoObserver = null;
function initLogoObserver(){
  if(!('IntersectionObserver' in window)) return;
  logoObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const el = entry.target;
        logoObserver.unobserve(el);
        applyTeamLogo(el, el.dataset.logo, el.dataset.color);
      }
    });
  },{rootMargin:"100px"});
}
function observeLogos(){
  if(!logoObserver){
    document.querySelectorAll(".lg[data-logo]:not([data-loaded])").forEach(el=>{
      el.dataset.loaded = "1";
      applyTeamLogo(el, el.dataset.logo, el.dataset.color);
    });
    return;
  }
  document.querySelectorAll(".lg[data-logo]:not([data-loaded])").forEach(el=>{
    el.dataset.loaded = "1";
    logoObserver.observe(el);
  });
}
function applyTeamLogo(el,name,color){
  if(!el)return;
  const cached = TEAM_LOGO_CACHE[name];
  if(cached){el.innerHTML = `<img src="${cached}" alt="${name}" loading="lazy">`;return}

  fetchTeamLogo(name).then(url=>{
    if(url && el.isConnected){
      el.innerHTML = `<img src="${url}" alt="${name}" loading="lazy" onerror="this.style.display='none'">`;
    }
  });
}

  o.classList.add("on");

function renderAnalysis(){
  const a = T();
  const matchPairs = [];
  for(let i=0;i<Math.min(6, a.length-1);i+=2) matchPairs.push({home:a[i],away:a[i+1]});
  let html = `<div class="sub" style="margin-bottom:12px">Анализ на основе позиции в таблице.</div>`;
  html += matchPairs.map((m,idx)=>{
    const xgH = getXG(m.home), xgA = getXG(m.away);
    const xgaH = getXGAgainst(m.home), xgaA = getXGAgainst(m.away);
    const mom = getMomentum(m.home, m.away);
    const total = xgH + xgA;
    const hPct = total > 0 ? (xgH / total * 100) : 50;
    return `<div class="tw" style="padding:14px;margin-bottom:10px;animation:staggerIn .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:${idx*70}ms">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font:700 14px var(--font-display)">
        <span style="display:flex;align-items:center;gap:6px">${lg(m.home)}${m.home.n}</span>
        <span style="font-size:10px;color:var(--text-tertiary);padding:2px 8px;border-radius:99px;background:var(--surface-2)">xG</span>
        <span style="display:flex;align-items:center;gap:6px">${m.away.n}${lg(m.away)}</span>
      </div>
      <div class="analysis-grid">
        <div class="an-card"><h4>⚽ xG</h4><div class="an-bar"><i class="home" style="width:${hPct}%">${xgH}</i><i class="away" style="width:${100-hPct}%">${xgA}</i></div><div class="an-legend"><span>${m.home.n}</span><span>${m.away.n}</span></div></div>
        <div class="an-card"><h4>🛡️ xGA</h4><div class="an-bar"><i class="home" style="width:${xgaH/(xgaH+xgaA)*100}%">${xgaH}</i><i class="away" style="width:${xgaA/(xgaH+xgaA)*100}%">${xgaA}</i></div><div class="an-legend"><span>${m.home.n}</span><span>${m.away.n}</span></div></div>
      </div>
      <div class="an-card" style="margin-top:8px"><h4>📊 Momentum</h4><div class="momentum">${mom.map((b,i)=>`<i class="${b.home >= b.away ? "pos" : "neg"}" style="height:${Math.max(8, b.home*100)}%;animation-delay:${i*45}ms"></i>`).join("")}</div></div>
    </div>`;
  }).join("");
  html += `<div class="note">xG — симуляция на основе позиции в таблице.</div>`;
  $("#v").innerHTML = html;
  observeLogos();
}
function getXG(team){const base = team.p / team.g * 1.2;const variance = (team.n.length % 5) * 0.15;return +(base + variance).toFixed(2);}
function getXGAgainst(team){const base = (team.ga || 1) / team.g * 1.1;const variance = (team.n.length % 3) * 0.1;return +(base + variance).toFixed(2);}
function getMomentum(team, other){const bars=[];const seed=team.n.length+other.n.length;for(let i=0;i<12;i++){const v=Math.sin(seed+i*0.8)*0.5+0.5;const diff=(team.p-other.p)/Math.max(1,team.p+other.p);const val=Math.max(0,Math.min(1,v+diff*0.3));bars.push({home:val,away:1-val});}return bars;}

function betMatches(){
  const a = T();
  const pairs = [];
  const offset = (betRound*2) % Math.max(1,a.length-3);
  for(let i=0;i<3;i++){
    const hi = (i+offset) % a.length, li = (i+offset+4) % a.length;
    if(hi===li)continue;
    pairs.push({home: a[hi], away: a[li]});
  }
  return pairs;
}
function calcOdds(home,away){
  const sH = home.p/home.g, sA = away.p/away.g;
  const diff = sH - sA;
  let pHome = 0.4 + diff*0.16, pDraw = 0.26 - Math.abs(diff)*0.06, pAway = 1 - pHome - pDraw;
  pHome = Math.max(0.05,Math.min(0.85,pHome));pDraw = Math.max(0.08,Math.min(0.35,pDraw));pAway = Math.max(0.05,Math.min(0.85,1-pHome-pDraw));
  const sum = pHome+pDraw+pAway; pHome/=sum;pDraw/=sum;pAway/=sum;
  return {pHome,pDraw,pAway,oddsHome:+(1.05/pHome).toFixed(2),oddsDraw:+(1.05/pDraw).toFixed(2),oddsAway:+(1.05/pAway).toFixed(2)};
}
function simulate(prob, outcome){const r=Math.random();let result;if(r<prob.pHome)result=0;else if(r<prob.pHome+prob.pDraw)result=1;else result=2;return{result,win:result===outcome};}
function placeBet(match, outcome, betOdds){
  const amount = 100;
  if(betBalance < amount) return {error:"Недостаточно средств"};
  const prob = calcOdds(match.home, match.away);
  const sim = simulate(prob, outcome);
  betBalance -= amount; let payout = 0;
  if(sim.win){payout = Math.round(amount * betOdds);betBalance += payout;}
  const record = {match:`${match.home.n} — ${match.away.n}`,outcome:outcome===0?"П1":outcome===1?"X":"П2",amount,odds:betOdds,status:sim.win?"win":"lose",payout,timestamp:Date.now()};
  betHistory.unshift(record);betHistory = betHistory.slice(0,20);save();
  return {win: sim.win, payout, amount};
}
function showBetResult(win,payout,amount){
  const el = $("#betResult");
  el.innerHTML = `<div class="bet-result-inner ${win?'win':'lose'}"><div class="bet-result-icon">${win?'🎉':'😢'}</div><div class="bet-result-text">${win?'ПОБЕДА!':'УВЫ...'}</div><div class="bet-result-amount ${win?'win':'lose'}">${win?'+'+(payout-amount)+' 🪙':'-'+amount+' 🪙'}</div><div class="sub" style="margin-top:8px">Баланс: ${betBalance} 🪙</div></div>`;
  el.classList.add("on");setTimeout(()=>el.classList.remove("on"),1800);
}
function renderBets(){
  const v = $("#v"),matches = betMatches();
  v.innerHTML = `
    <div class="bet-simple">
      <div class="bet-balance-simple"><div><div class="lbl">Демо-баланс</div><div class="val">${betBalance.toLocaleString('ru-RU')} 🪙</div></div><button id="resetBet">Сброс</button></div>
      <h3>🎲 Простые ставки</h3><div class="hint">Ставка 100 🪙, результат сразу.</div>
      <div class="bet-list" id="betList"></div>
      <div class="bet-log"><h4>Последние ставки</h4><div id="betLog"></div></div>
    </div>`;
  const bl = $("#betList");
  bl.innerHTML = matches.map((m,i)=>{
    const odds = calcOdds(m.home,m.away);
    const mid = `${m.home.uid}_vs_${m.away.uid}`;
    const picked = betActive[mid];
    return `<div class="bet-row" style="animation-delay:${i*40}ms">
      <div class="names"><div class="nm">${lg(m.home)}<span>${m.home.n}</span></div><span class="vs">VS</span><div class="nm away"><span>${m.away.n}</span>${lg(m.away)}</div></div>
      <div class="bet-btns">
        <button data-bet="${mid}" data-out="0" ${picked!==undefined?'disabled':''} class="${picked===0?'picked':''}"><span class="lb2">П1</span><span class="od">${odds.oddsHome.toFixed(2)}</span></button>
        <button data-bet="${mid}" data-out="1" ${picked!==undefined?'disabled':''} class="${picked===1?'picked':''}"><span class="lb2">X</span><span class="od">${odds.oddsDraw.toFixed(2)}</span></button>
        <button data-bet="${mid}" data-out="2" ${picked!==undefined?'disabled':''} class="${picked===2?'picked':''}"><span class="lb2">П2</span><span class="od">${odds.oddsAway.toFixed(2)}</span></button>
      </div>
    </div>`;
  }).join("");
  const log = $("#betLog");
  if(betHistory.length===0) log.innerHTML = `<div class="sub" style="padding:8px 0">Пока нет ставок.</div>`;
  else log.innerHTML = betHistory.slice(0,6).map(h=>`<div class="bet-log-item"><div class="nm2"><b>${h.match}</b><small>${h.outcome} · ${h.odds}</small></div><div class="res ${h.status}">${h.status==='win'?'+'+(h.payout-h.amount):'-'+h.amount} 🪙</div></div>`).join("");
  $("#resetBet").onclick = () => {if(confirm('Сбросить?')){betBalance=BET_START;betHistory=[];betActive={};betRound=0;save();toast("Сброшено");renderBets();}};
  bl.querySelectorAll("[data-bet]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const mid = btn.dataset.bet,out = +btn.dataset.out;
      const match = matches.find(m=>`${m.home.uid}_vs_${m.away.uid}`===mid);
      if(!match)return;
      const odds = calcOdds(match.home, match.away);
      const betOdds = out===0?odds.oddsHome:out===1?odds.oddsDraw:odds.oddsAway;
      const r = placeBet(match, out, betOdds);
      if(r.error){toast(r.error);return}
      betActive[mid] = out;save();
      showBetResult(r.win, r.payout, r.amount);
      toast(r.win?`🎉 +${r.payout-100} 🪙`:`-100 🪙`);
      setTimeout(()=>renderBets(), 350);
    });
  });
  observeLogos();
}
